<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeHub 구조 지도</title><style>
:root{--paper:#FBFCFD;--sheet:#FFFFFF;--ink:#18212B;--muted:#5B6773;--rule:#D9DFE6;--rule2:#EEF1F4;
  --accent:#1F5F8B;--accent-tint:#E9F1F7;--ok:#2D7A4C;--ok-tint:#E7F3EB;--bad:#B83227;--bad-tint:#FCEBE9;
  --chg:#9A6512;--chg-tint:#FFF3D9;--code:#F4F6F8;--ext:#F3F5F7;
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"D2Coding","JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#11161C;--sheet:#171E26;--ink:#E4E9EE;--muted:#9AA6B2;--rule:#2C3743;
  --rule2:#212A34;--accent:#7DB4DD;--accent-tint:#1B2B39;--ok:#6CC08F;--ok-tint:#17291F;--bad:#F08A7E;--bad-tint:#36191A;
  --chg:#E2B259;--chg-tint:#33270F;--code:#1C242D;--ext:#1C242D}}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
body{margin:0}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 22px 60px}
h1{font-size:25px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 14px;max-width:80ch}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);margin:0 0 10px;font-size:14px}
.bar #crumbs a{text-decoration:none}
.bar #crumbs b{color:var(--ink)}
.bar .sp{flex:1}
button{font:inherit;font-size:13.5px;padding:4px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);
  border-radius:4px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4;cursor:default;border-color:var(--rule);color:var(--ink)}
button.big{font-size:15px;font-weight:700;padding:7px 16px;background:var(--accent);color:#fff;border-color:var(--accent)}
button.big:hover{color:#fff;opacity:.9}
h2#ltitle{font-size:19px;margin:6px 0 6px}
.stagewrap{overflow:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
#stage{padding:8px}
#stage svg{width:100%;height:auto;display:block}
#desc{margin-top:14px}
#desc h3{font-size:16px;margin:20px 0 6px}
#desc p,#desc li{max-width:84ch}
.next{color:var(--accent);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--sheet);margin:6px 0 12px}
th,td{text-align:left;vertical-align:top;padding:6px 10px;border-bottom:1px solid var(--rule2)}
th{font-weight:600;white-space:nowrap;color:var(--ink)}
code{font-family:var(--mono);font-size:13px}
pre{font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--code);border:1px solid var(--rule);padding:10px 14px;
  overflow-x:auto;margin:6px 0 12px}
.code pre{margin:0;background:transparent;border:0;font-size:13.5px}
.code pre b{background:var(--chg-tint);color:var(--chg)}
.code .c{color:var(--muted)}
.hint2{font-size:13px;color:var(--muted);margin:0 0 8px}
/* tour panel */
.tour{border:2px solid var(--accent);border-radius:6px;padding:12px 16px;background:var(--accent-tint)}
.tour .hd{display:flex;gap:10px;align-items:center;margin:0 0 6px;font-weight:700}
.tour .txt{font-size:15px;margin:0 0 10px;min-height:3.2em}
.tour .st{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;margin:0 0 10px}
.tour .st span b{font-family:var(--mono);font-size:13px}
.chip{display:inline-block;font-family:var(--mono);font-size:12.5px;padding:0 6px;border:1px solid var(--rule);border-radius:3px;
  background:var(--sheet);margin-right:3px}
.chip.crit{border-color:var(--chg);color:var(--chg)}
.qctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
#qmsg{font-size:13.5px;color:var(--muted);margin-left:6px}
#qmsg code{color:var(--ink)}
/* svg */
svg text{font-family:var(--sans);fill:var(--ink)}
svg .tt{font-size:14px;font-weight:700}
svg .sub{font-family:var(--mono);font-size:11.5px;fill:var(--muted);font-weight:400}
svg .ln{font-size:12.5px;fill:var(--muted)}
svg .dk{fill:var(--ink)}
svg .m{font-family:var(--mono)}
svg .mu{fill:var(--muted)}
svg .big{font-size:16px}
svg .el{font-size:11.5px;fill:var(--muted)}
svg .gl{font-size:13px;font-weight:700;fill:var(--muted)}
svg .zoom{font-size:16px;fill:var(--accent)}
svg .hint{fill:var(--accent);font-weight:600}
svg .alarm{fill:var(--bad)}
.node rect,.node polygon{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.node.ext rect{fill:var(--ext);stroke:var(--muted)}
.node.main rect{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.6}
.node.big .tt{font-size:20px}
.node.mono-title .tt{font-family:var(--mono);font-size:13.5px}
.node.ok rect{fill:var(--ok-tint);stroke:var(--ok)}
.node.bad rect{fill:var(--bad-tint);stroke:var(--bad)}
.node.start rect{fill:var(--accent-tint);stroke:var(--accent)}
.node.dia polygon{fill:var(--sheet);stroke:var(--accent)}
.node.state rect{fill:var(--accent-tint);stroke:var(--accent)}
.node.alarmbox rect{fill:var(--bad-tint);stroke:var(--bad)}
.node.codebtn rect{fill:var(--chg-tint);stroke:var(--chg)}
.node.codebtn .tt{fill:var(--chg)}
.node.codebtn .zoom{fill:var(--chg)}
.node[data-go]{cursor:pointer}
.node[data-go]:hover rect{stroke:var(--accent);stroke-width:2.6}
.grp{fill:none;stroke:var(--muted);stroke-dasharray:5 4}
.edge path,.lnk,.wrapline{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#ah)}
.edge.dash path,.lnk.dash{stroke-dasharray:6 4}
.ahd{fill:var(--muted)} .ahd2{fill:var(--accent)}
.cell{fill:var(--sheet);stroke:var(--ink);stroke-width:1.1}
.cell.on{fill:var(--accent-tint)}
.cell.crit{fill:var(--chg-tint);stroke:var(--chg)}
.cell.hi{stroke:var(--accent);stroke-width:3}
.qc{fill:var(--sheet);stroke:var(--muted)}
.qc.on{fill:var(--accent)} .qc.crit{fill:var(--chg)}
.term{fill:var(--code);stroke:var(--rule)}
.track{fill:var(--rule2);stroke:var(--rule)}
.seg{fill:var(--accent-tint);stroke:var(--accent)}
.seg.over{fill:var(--bad-tint);stroke:var(--bad);stroke-dasharray:5 3}
.cap{stroke:var(--bad);stroke-width:2;stroke-dasharray:4 3}
.mk{stroke:var(--accent);stroke-width:2;marker-end:url(#ah2)}
.mkt{fill:var(--accent);font-size:13px;font-weight:700}
/* tour highlighting */
svg.touring .node,svg.touring .edge,svg.touring .grp,svg.touring .gl{opacity:.22;transition:opacity .25s}
svg.touring .on{opacity:1}
svg.touring .edge.on path{stroke:var(--accent);stroke-width:2.6;marker-end:url(#ah2)}
svg.touring .node.on rect{stroke:var(--accent);stroke-width:2.6}
.token{fill:var(--chg);stroke:var(--sheet);stroke-width:2}
</style></head><body><div class="wrap">
<h1>HomeHub 구조 지도</h1>
<p class="lead">지도를 확대하듯 바깥에서 안으로 들어가며 봅니다. <b>⊕ 표시가 있는 상자를 누르면</b> 그 안의 자세한 그림이 나옵니다.
위 경로를 누르거나 <b>← 밖으로</b>(또는 Esc)를 누르면 한 단계 밖으로 나옵니다.</p>
<div class="bar"><button id="out">← 밖으로</button><span id="crumbs"></span><span class="sp"></span></div>
<h2 id="ltitle"></h2>
<div class="stagewrap"><div id="stage"></div></div>
<div id="desc"></div>
</div>
<!--HH_START-->
<script>const L={"outside": {"title": "바깥에서 본 HomeHub", "crumb": "HomeHub 바깥", "parent": null, "vb": "0 0 1000 430", "svg": "<g class=\"node ext\" id=\"n-devs\" data-go=\"devices\"><rect x=\"20\" y=\"110\" width=\"230\" height=\"230\" rx=\"6\"/><text x=\"32\" y=\"131\" class=\"tt\">가전 8대<\/text><text x=\"32\" y=\"148\" class=\"ln\">세탁기 <tspan class='m'>washer-1<\/tspan><\/text><text x=\"32\" y=\"165\" class=\"ln\">건조기 <tspan class='m'>dryer-1<\/tspan><\/text><text x=\"32\" y=\"182\" class=\"ln\">냉장고 <tspan class='m'>fridge-1, fridge-2<\/tspan><\/text><text x=\"32\" y=\"199\" class=\"ln\">에어컨 <tspan class='m'>aircon-1<\/tspan><\/text><text x=\"32\" y=\"216\" class=\"ln\">오븐 <tspan class='m'>oven-1<\/tspan><\/text><text x=\"32\" y=\"233\" class=\"ln\">누수센서 <tspan class='m'>leak-1<\/tspan><\/text><text x=\"32\" y=\"250\" class=\"ln\">TV <tspan class='m'>tv-1<\/tspan><\/text><text x=\"32\" y=\"267\" class=\"ln\"><tspan class='mu'>무슨 일이 생기면 메시지를 보냄<\/tspan><\/text><text x=\"240\" y=\"129\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"edge\" id=\"e-msg\"><path d=\"M250,200 H408\"/><text x=\"329\" y=\"190\" class=\"el\" text-anchor=\"middle\">메시지 한 줄<\/text><\/g><text x=\"329\" y=\"222\" class=\"el m\" text-anchor=\"middle\">10|fridge-1|TEMP|12|…<\/text><g class=\"node main big\" id=\"n-hh\" data-go=\"inside\"><rect x=\"410\" y=\"100\" width=\"230\" height=\"200\" rx=\"6\"/><text x=\"422\" y=\"121\" class=\"tt\">HomeHub<\/text><text x=\"422\" y=\"138\" class=\"ln\">가전 메시지를 받아<\/text><text x=\"422\" y=\"155\" class=\"ln\">차례대로 처리하는 프로그램<\/text><text x=\"422\" y=\"172\" class=\"ln\"><\/text><text x=\"422\" y=\"189\" class=\"ln\"><tspan class='hint'>⊕ 눌러서 안으로 들어가기<\/tspan><\/text><text x=\"630\" y=\"119\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node ext\" id=\"n-cfg\" data-go=\"config\"><rect x=\"410\" y=\"350\" width=\"230\" height=\"64\" rx=\"6\"/><text x=\"422\" y=\"371\" class=\"tt\">설정 파일<\/text><text x=\"422\" y=\"387\" class=\"sub\">hub.properties<\/text><text x=\"630\" y=\"369\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"edge\" id=\"e-cfg\"><path d=\"M525,350 V302\"/><text x=\"531\" y=\"330\" class=\"el\">읽음<\/text><\/g><g class=\"node ext\" id=\"n-o1\" data-go=\"hub\"><rect x=\"740\" y=\"20\" width=\"240\" height=\"80\" rx=\"6\"/><text x=\"752\" y=\"41\" class=\"tt\">상태 한 줄<\/text><text x=\"752\" y=\"58\" class=\"ln\">지금 허브 상태를 글자 한 줄로<\/text><text x=\"970\" y=\"39\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"edge\" id=\"e-o1\"><path d=\"M640,200 C690,200 690,60 738,60\"/><\/g><g class=\"node ext\" id=\"n-o2\" data-go=\"logs\"><rect x=\"740\" y=\"160\" width=\"240\" height=\"80\" rx=\"6\"/><text x=\"752\" y=\"181\" class=\"tt\">로그<\/text><text x=\"752\" y=\"198\" class=\"ln\">무슨 일이 있었는지 적은 기록<\/text><text x=\"970\" y=\"179\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"edge\" id=\"e-o2\"><path d=\"M640,200 C690,200 690,200 738,200\"/><\/g><g class=\"node ext\" id=\"n-o3\" data-go=\"metrics\"><rect x=\"740\" y=\"300\" width=\"240\" height=\"80\" rx=\"6\"/><text x=\"752\" y=\"321\" class=\"tt\">개수<\/text><text x=\"752\" y=\"338\" class=\"ln\">일마다 몇 번 일어났는지 센 숫자<\/text><text x=\"970\" y=\"319\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"edge\" id=\"e-o3\"><path d=\"M640,200 C690,200 690,340 738,340\"/><\/g>", "desc": "\n<h3>HomeHub는 무엇인가<\/h3>\n<p>HomeHub는 집 안 가전을 한곳에서 관리하는 프로그램입니다(이 실습을 위해 만든 가상의 프로그램, Java 8, 약 1,600줄).<\/p>\n<p>가전은 무슨 일이 생길 때마다 HomeHub에 <b>메시지<\/b> 한 줄을 보냅니다. \"전원이 켜졌다\", \"온도를 재 보니 12°C다\", \"물이 샌다\" 같은 것입니다.\nHomeHub는 메시지를 받은 순서대로 처리하고, 필요하면 가전을 멈춥니다. 예를 들어 냉장고 온도가 계속 높으면 냉장고를 고장 상태로 돌리고, 물이 새면 돌고 있는 세탁기와 건조기를 멈춥니다.<\/p>\n<p>처리한 결과는 오른쪽 세 가지로 남습니다.<\/p>\n<table>\n<tr><th>상태 한 줄<\/th><td>지금 허브 상태(대기 중인 일, 기기마다 상태, 전력, 개수, 최근 로그)를 글자 한 줄로 적은 것. 이 한 줄을 만드는 함수가 <code>HomeHub.observable()<\/code>입니다. 실습의 <b>동작 기록<\/b>(<code>golden/*.trace<\/code>)은 메시지를 하나 처리할 때마다 이 한 줄을 적어 둔 파일입니다.<\/td><\/tr>\n<tr><th>로그<\/th><td>무슨 일이 있었는지 한 줄씩 적은 기록. 예: <code>OVERHEAT_ALARM:1000000@fridge-1<\/code> = fridge-1에 과열 경보.<\/td><\/tr>\n<tr><th>개수<\/th><td>일마다 몇 번 일어났는지 센 숫자. 예: <code>submit.accepted=12<\/code> = 지금까지 받아들인 이벤트가 12개.<\/td><\/tr>\n<\/table>\n\n<h3>메시지 한 줄은 이렇게 생겼습니다<\/h3>\n<p><code>10|fridge-1|TEMP|12|240000|unit=C<\/code> = 10번 메시지, 냉장고 1이(<code>fridge-1<\/code>) 온도를 보고(<code>TEMP<\/code>), 값은 12, 보낸 시각은 240,000ms(4분), 단위는 섭씨.\n칸마다 뜻은 HomeHub 안의 <a href=\"#\" data-go=\"parser\">입구<\/a>에서 자세히 봅니다.<\/p>\n\n<h3>실습에서는: 입력 파일과 동작 기록<\/h3>\n<p>실습에는 진짜 가전이 없습니다. 대신 가전이 보냈을 메시지를 시간 순서대로 적은 <b>입력 파일<\/b>(<code>legacy/workloads/*.txt<\/code>)을 HomeHub에 한 줄씩 넣습니다.<\/p>\n<pre>1|fridge-1|PWR_ON|0|0|fw=2.1        ← 메시지: 냉장고 1 전원 켜짐\n4|fridge-1|TEMP|9|60000|unit=C      ← 메시지: 냉장고 1 온도 9°C\n!drain                              ← 명령: 쌓인 일을 모두 처리하라<\/pre>\n<p><code>!<\/code>로 시작하는 줄은 메시지가 아니라 <b>명령<\/b>입니다. 진짜 허브는 쌓인 일을 쉬지 않고 처리하지만, 실습에서는 언제 처리할지를 입력 파일이 정합니다.\n<code>!drain<\/code>은 \"쌓인 일을 모두 처리\", <code>!step<\/code>은 \"하나만 처리\", <code>!tick<\/code>은 \"점검 한 번\"입니다.<\/p>\n\n<p class=\"next\">다음: 가운데 <b>HomeHub<\/b> 상자를 누르세요. 안에 어떤 부품이 있는지 보입니다.<\/p>\n"}, "inside": {"title": "HomeHub 안의 부품", "crumb": "HomeHub 안", "parent": "outside", "vb": "0 0 1000 620", "svg": "<g class=\"node main\" id=\"n-hub\" data-go=\"hub\"><rect x=\"20\" y=\"12\" width=\"960\" height=\"64\" rx=\"6\"/><text x=\"32\" y=\"36\" class=\"tt\">HomeHub <tspan class=\"sub\">app.HomeHub<\/tspan><\/text><text x=\"32\" y=\"53\" class=\"ln\">모든 부품을 만들어 서로 연결하고, 바깥에서 부르는 ingest · step · drain · tick 으로 일을 진행시킵니다<\/text><text x=\"970\" y=\"31\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-parser\" data-go=\"parser\"><rect x=\"70\" y=\"112\" width=\"140\" height=\"70\" rx=\"6\"/><text x=\"82\" y=\"133\" class=\"tt\">입구<\/text><text x=\"82\" y=\"149\" class=\"sub\">EventParser<\/text><text x=\"82\" y=\"166\" class=\"ln\">한 줄 → 이벤트<\/text><text x=\"200\" y=\"131\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-disp\" data-go=\"disp\"><rect x=\"250\" y=\"112\" width=\"180\" height=\"100\" rx=\"6\"/><text x=\"262\" y=\"133\" class=\"tt\">접수·꺼내기<\/text><text x=\"262\" y=\"149\" class=\"sub\">Dispatcher<\/text><text x=\"262\" y=\"166\" class=\"ln\">대기열에 넣을지 정함<\/text><text x=\"262\" y=\"183\" class=\"ln\">하나 꺼내 처리기로<\/text><text x=\"420\" y=\"131\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-queue\" data-go=\"queue\"><rect x=\"490\" y=\"112\" width=\"180\" height=\"100\" rx=\"6\"/><text x=\"502\" y=\"133\" class=\"tt\">대기열<\/text><text x=\"502\" y=\"149\" class=\"sub\">RingEventQueue<\/text><text x=\"502\" y=\"166\" class=\"ln\">처리 차례를 기다리는 줄<\/text><text x=\"660\" y=\"131\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><rect class=\"qc\" id=\"qc0\" x=\"502\" y=\"182\" width=\"18\" height=\"18\" rx=\"2\"/><rect class=\"qc\" id=\"qc1\" x=\"522\" y=\"182\" width=\"18\" height=\"18\" rx=\"2\"/><rect class=\"qc\" id=\"qc2\" x=\"542\" y=\"182\" width=\"18\" height=\"18\" rx=\"2\"/><rect class=\"qc\" id=\"qc3\" x=\"562\" y=\"182\" width=\"18\" height=\"18\" rx=\"2\"/><rect class=\"qc\" id=\"qc4\" x=\"582\" y=\"182\" width=\"18\" height=\"18\" rx=\"2\"/><rect class=\"qc\" id=\"qc5\" x=\"602\" y=\"182\" width=\"18\" height=\"18\" rx=\"2\"/><rect class=\"qc\" id=\"qc6\" x=\"622\" y=\"182\" width=\"18\" height=\"18\" rx=\"2\"/><rect class=\"qc\" id=\"qc7\" x=\"642\" y=\"182\" width=\"18\" height=\"18\" rx=\"2\"/><g class=\"node \" id=\"n-watch\" data-go=\"watch\"><rect x=\"740\" y=\"112\" width=\"240\" height=\"64\" rx=\"6\"/><text x=\"752\" y=\"133\" class=\"tt\">점검<\/text><text x=\"752\" y=\"149\" class=\"sub\">Watchdog<\/text><text x=\"752\" y=\"166\" class=\"ln\">대기열이 계속 꽉 차 있나 보기<\/text><text x=\"970\" y=\"131\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-recov\" data-go=\"watch\"><rect x=\"740\" y=\"188\" width=\"240\" height=\"64\" rx=\"6\"/><text x=\"752\" y=\"209\" class=\"tt\">복구<\/tex " class=\"tt\">안전 처리기<\/text><text x=\"502\" y=\"465\" class=\"sub\">SafetyHandler<\/text><text x=\"502\" y=\"482\" class=\"ln\">누수·과열 때 멈춤<\/text><text x=\"660\" y=\"447\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-hCount\" data-go=\"handlers\"><rect x=\"490\" y=\"494\" width=\"180\" height=\"58\" rx=\"6\"/><text x=\"502\" y=\"515\" class=\"tt\">개수 처리기<\/text><text x=\"502\" y=\"531\" class=\"sub\">CountingHandler<\/text><text x=\"502\" y=\"548\" class=\"ln\">모든 이벤트 개수 세기<\/text><text x=\"660\" y=\"513\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><rect x=\"740\" y=\"268\" width=\"240\" height=\"300\" rx=\"10\" class=\"grp\"/><text x=\"752\" y=\"287\" class=\"gl\">처리기들이 바꾸는 것<\/text><g class=\"node \" id=\"n-logs\" data-go=\"logs\"><rect x=\"750\" y=\"296\" width=\"220\" height=\"58\" rx=\"6\"/><text x=\"762\" y=\"317\" class=\"tt\">로그<\/text><text x=\"762\" y=\"333\" class=\"sub\">AuditLog<\/text><text x=\"762\" y=\"350\" class=\"ln\">무슨 일이 있었나 적기<\/text><text x=\"960\" y=\"315\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-metrics\" data-go=\"metrics\"><rect x=\"750\" y=\"362\" width=\"220\" height=\"58\" rx=\"6\"/><text x=\"762\" y=\"383\" class=\"tt\">개수 세기<\/text><text x=\"762\" y=\"399\" class=\"sub\">Metrics<\/text><text x=\"762\" y=\"416\" class=\"ln\">이름별로 횟수 세기<\/text><text x=\"960\" y=\"381\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-power\" data-go=\"power\"><rect x=\"750\" y=\"428\" width=\"220\" height=\"58\" rx=\"6\"/><text x=\"762\" y=\"449\" class=\"tt\">전력 관리<\/text><text x=\"762\" y=\"465\" class=\"sub\">PowerBudget<\/text><text x=\"762\" y=\"482\" class=\"ln\">동시 전력 4,000W 이하로<\/text><text x=\"960\" y=\"447\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-devices\" data-go=\"devices\"><rect x=\"750\" y=\"494\" width=\"220\" height=\"58\" rx=\"6\"/><text x=\"762\" y=\"515\" class=\"tt\">기기 목록<\/text><text x=\"762\" y=\"531\" class=\"sub\">DeviceRegistry<\/text><text x=\"762\" y=\"548\" class=\"ln\">기기 8대와 각 상태<\/text><text x=\"960\" y=\"513\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"edge\" id=\"e-parse\"><path d=\"M140,76 V110\"/><text x=\"146\" y=\"98\" class=\"el\">① 바꾸기<\/text><\/g><g class=\"edge\" id=\"e-submit\"><path d=\"M300,76 V110\"/><text x=\"306\" y=\"98\" class=\"el\">② 넣기<\/text><\/g><g class=\"edge\" id=\"e-step\"><path d=\"M390,76 V110\"/><text x=\"396\" y=\"98\" class=\"el\">꺼내 처리 (step · drain)<\/text><\/g><g class=\"edge\" id=\"e-offer\"><path d=\"M430,145 H488\"/><text x=\"459\" y=\"138\" class=\"el\" text-anchor=\"middle\">넣기<\/text><\/g><g class=\"edge\" id=\"e-poll\"><path d=\"M488,180 H432\"/><text x=\"459\" y=\"197\" class=\"el\" text-anchor=\"middle\">꺼내기<\/text><\/g><g class=\"edge\" id=\"e-reg\"><path d=\"M340,212 V288\"/><text x=\"346\" y=\"254\" class=\"el\">넘김<\/text><\/g><g class=\"edge\" id=\"e-notify\"><path d=\"M250,195 H120 V288\"/><text x=\"126\" y=\"254\" class=\"el\">처리 끝 알림<\/text><\/g><g class=\"edge\" id=\"e-back\"><path d=\"M40,288 V78\"/><text x=\"46\" y=\"226\" class=\"el\">새 이벤트<\/text><text x=\"46\" y=\"240\" class=\"el\">다시 넣기<\/text><\/g><g class=\"edge\" id=\"e-choose\"><path d=\"M430,327 H488\"/><text x=\"459\" y=\"319\" class=\"el\" text-anchor=\"middle\">종류로<\/text><\/g><g class=\"edge\" id=\"e-change\"><path d=\"M680,420 H738\"/><text x=\"709\" y=\"412\" class=\"el\" text-anchor=\"middle\">바꿈<\/text><\/g><g class=\"edge\" id=\"e-tick\"><path d=\"M860,76 V110\"/><text x=\"866\" y=\"98\" class=\"el\">tick: 1초마다 점검<\/text><\/g><g class=\"edge\" id=\"e-wq\"><path d=\"M740,140 H672\"/><text x=\"706\" y=\"132\" class=\"el\" text-anchor=\"middle\">개수 보기<\/text><\/g><g class=\"edge\" id=\"e-rq\"><path d=\"M740,222 H672\"/><text x=\"706\" y=\"214\" class=\"el\" text-anchor=\"middle\">정리<\/text><\/g><g class=\"edge\" id=\"e-read\"><path d=\"M120,386 V600 H860 V556\"/><text x=\"140\" y=\"594\" class=\"el\">기기 정보 읽기 (예: 연속 고온 횟수)<\/text><\/g>", "desc": "\n<p class=\"tourcall\"><button class=\"big\" data-act=\"tour\">▶ 메시지 하나 따라가기<\/button>\n냉장고가 높은 온도를 보고한 메시지 하나가 어느 부품을 거쳐 어떻게 처리되는지, 위 그림에서 한 단계씩 보여 줍니다.<\/p>\n<h3>HomeHub 안의 부품<\/h3>\n<p>HomeHub 안에는 일을 나눠 맡은 부품(Java 객체)이 있습니다. 큰 흐름은 <b>왼쪽 위에서 오른쪽 아래로<\/b> 갑니다.\n메시지가 <b>입구<\/b>에서 이벤트로 바뀌고 → <b>접수<\/b>가 <b>대기열<\/b>에 넣고 → 차례가 오면 꺼내서 → <b>처리기<\/b>가 일을 하고 → 오른쪽 아래(기기 상태, 전력, 로그, 개수)를 바꿉니다.\n⊕ 표시가 있는 상자를 누르면 그 부품 안으로 들어갑니다.<\/p>\n<h3>먼저 알아 둘 말<\/h3>\n<table>\n<tr><th>메시지와 이벤트<\/th><td>메시지는 가전이 보낸 <b>글자 한 줄<\/b>, 이벤트는 그 한 줄을 프로그램이 다루기 좋게 바꾼 <b>객체<\/b>(<code>Event<\/code>)입니다. 이벤트에는 번호, 기기, 종류, 값, 시각이 들어 있습니다.<\/td><\/tr>\n<tr><th>대기열<\/th><td>들어온 이벤트가 처리 차례를 기다리는 줄입니다. 먼저 들어온 것이 먼저 처리됩니다. 칸은 8개뿐입니다.<\/td><\/tr>\n<tr><th>중요 이벤트<\/th><td>누수(<code>LEAK<\/code>)와 과열(<code>OVHT<\/code>) 두 종류. 대기열이 가득 차도 절대 버리지 않습니다.<\/td><\/tr>\n<tr><th>처리기<\/th><td>이벤트 종류마다 실제 일을 하는 부품입니다. 온도 보고는 온도 처리기, 누수는 안전 처리기가 맡는 식입니다.<\/td><\/tr>\n<\/table>\n"}, "config": {"title": "설정", "crumb": "설정", "parent": "outside", "vb": "0 0 1000 330", "svg": "<rect class=\"term\" x=\"20\" y=\"16\" width=\"960\" height=\"308\" rx=\"6\"/><text x=\"40\" y=\"44\" class=\"ln m dk\">queue.capacity=8<\/text><text x=\"480\" y=\"44\" class=\"ln\">대기열 칸 수<\/text><text x=\"40\" y=\"80\" class=\"ln m dk\">dispatch.autoDrainOnFull=false<\/text><text x=\"480\" y=\"80\" class=\"ln\">가득 찼을 때 비중요 이벤트를 거부 (R4)<\/text><text x=\"40\" y=\"116\" class=\"ln m dk\">power.capWatts=4000<\/text><text x=\"480\" y=\"116\" class=\"ln\">동시 전력 상한 (W)<\/text><text x=\"40\" y=\"152\" class=\"ln m dk\">watchdog.threshold=3<\/text><text x=\"480\" y=\"152\" class=\"ln\">점검 몇 번 연속 꽉 차면 '막힘'인가<\/text><text x=\"40\" y=\"188\" class=\"ln m dk\">temp.highCelsius=10<\/text><text x=\"480\" y=\"188\" class=\"ln\">이 온도 이상이면 고온<\/text><text x=\"40\" y=\"224\" class=\"ln m dk\">rules.overheatAfterReports=3<\/text><text x=\"480\" y=\"224\" class=\"ln\">고온 몇 번 연속이면 과열 이벤트<\/text><text x=\"40\" y=\"260\" class=\"ln m dk\">rules.doorOpenAlertMillis=300000<\/text><text x=\"480\" y=\"260\" class=\"ln\">문이 이만큼(5분) 열려 있으면 로그<\/text><text x=\"40\" y=\"296\" class=\"ln m dk\">devices=washer-1:WASHER,…<\/text><text x=\"480\" y=\"296\" class=\"ln\">등록할 기기 8대<\/text>", "desc": "\n<h3>설정: hub.properties<\/h3>\n<p>HomeHub가 시작할 때 읽는 설정입니다. 파일이 없으면 위의 기본값을 씁니다(<code>HubConfig<\/code>). 실습은 모두 기본값으로 돌립니다.<\/p>\n<p>실습 C의 패치 B는 여기에 없던 <code>dispatch.maxPending<\/code>이라는 키를 새로 만듭니다.<\/p>\n"}, "hub": {"title": "HomeHub: 조립과 진행", "crumb": "HomeHub 객체", "parent": "inside", "vb": "0 0 1000 420", "svg": "<g class=\"node static ext\"><rect x=\"20\" y=\"20\" width=\"176\" height=\"40\" rx=\"20\"/><text x=\"108\" y=\"45\" class=\"ln dk\" text-anchor=\"middle\">메시지 줄<\/text><\/g><g class=\"edge\" id=\"e-h0\"><path d=\"M108,60 V98\"/><\/g><g class=\"node mono-title\" id=\"n-m0\" data-go=\"parser\"><rect x=\"20\" y=\"100\" width=\"176\" height=\"120\" rx=\"6\"/><text x=\"32\" y=\"121\" class=\"tt\">ingest(한 줄)<\/text><text x=\"32\" y=\"138\" class=\"ln\">입구에서 이벤트로<\/text><text x=\"32\" y=\"155\" class=\"ln\">바꾸고 접수에 넣음<\/text><text x=\"32\" y=\"172\" class=\"ln\">새 이벤트도 넣음<\/text><text x=\"186\" y=\"119\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node static ext\"><rect x=\"216\" y=\"20\" width=\"176\" height=\"40\" rx=\"20\"/><text x=\"304\" y=\"45\" class=\"ln dk\" text-anchor=\"middle\">!step<\/text><\/g><g class=\"edge\" id=\"e-h1\"><path d=\"M304,60 V98\"/><\/g><g class=\"node mono-title\" id=\"n-m1\" data-go=\"disp\"><rect x=\"216\" y=\"100\" width=\"176\" height=\"120\" rx=\"6\"/><text x=\"228\" y=\"121\" class=\"tt\">step()<\/text><text x=\"228\" y=\"138\" class=\"ln\">대기열에서 하나<\/text><text x=\"228\" y=\"155\" class=\"ln\">꺼내 처리<\/text><text x=\"228\" y=\"172\" class=\"ln\">새 이벤트도 넣음<\/text><text x=\"382\" y=\"119\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node static ext\"><rect x=\"412\" y=\"20\" width=\"176\" height=\"40\" rx=\"20\"/><text x=\"500\" y=\"45\" class=\"ln dk\" text-anchor=\"middle\">!drain<\/text><\/g><g class=\"edge\" id=\"e-h2\"><path d=\"M500,60 V98\"/><\/g><g class=\"node mono-title\" id=\"n-m2\" data-go=\"disp\"><rect x=\"412\" y=\"100\" width=\"176\" height=\"120\" rx=\"6\"/><text x=\"424\" y=\"121\" class=\"tt\">drain()<\/text><text x=\"424\" y=\"138\" class=\"ln\">대기열이 빌 때까지<\/text><text x=\"424\" y=\"155\" class=\"ln\">step()을 반복<\/text><text x=\"578\" y=\"119\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node static ext\"><rect x=\"608\" y=\"20\" width=\"176\" height=\"40\" rx=\"20\"/><text x=\"696\" y=\"45\" class=\"ln dk\" text-anchor=\"middle\">!tick<\/text><\/g><g class=\"edge\" id=\"e-h3\"><path d=\"M696,60 V98\"/><\/g><g class=\"node mono-title\" id=\"n-m3\" data-go=\"watch\"><rect x=\"608\" y=\"100\" width=\"176\" height=\"120\" rx=\"6\"/><text x=\"620\" y=\"121\" class=\"tt\">tick()<\/text><text x=\"620\" y=\"138\" class=\"ln\">점검을 한 번 하고<\/text><text x=\"620\" y=\"155\" class=\"ln\">막혔다고 하면 복구<\/text><text x=\"774\" y=\"119\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node static ext\"><rect x=\"804\" y=\"20\" width=\"176\" height=\"40\" rx=\"20\"/><text x=\"892\" y=\"45\" class=\"ln dk\" text-anchor=\"middle\">모든 줄 뒤<\/text><\/g><g class=\"edge\" id=\"e-h4\"><path d=\"M892,60 V98\"/><\/g><g class=\"node mono-title\" id=\"n-m4\"><rect x=\"804\" y=\"100\" width=\"176\" height=\"120\" rx=\"6\"/><text x=\"816\" y=\"121\" class=\"tt\">observable()<\/text><text x=\"816\" y=\"138\" class=\"ln\">지금 상태를<\/text><text x=\"816\" y=\"155\" class=\"ln\">글자 한 줄로 만듦<\/text><\/g><text x=\"20\" y=\"250\" class=\"el\">위: 입력 파일의 줄  →  아래: HubMain이 부르는 HomeHub 메서드<\/text><g class=\"node static wide\"><rect x=\"20\" y=\"280\" width=\"960\" height=\"120\" rx=\"6\"/><text x=\"32\" y=\"302\" class=\"tt\">생성자: new HomeHub(설정)<\/text><text x=\"32\" y=\"324\" class=\"ln\">설정을 읽어 부품을 모두 만들고 서로 연결합니다(조립). 대기열 8칸, 전력 상한 4,000W, 기기 8대 등록이 여기서 정해집니다.<\/text><text x=\"32\" y=\"342\" class=\"ln\">어떤 종류의 이벤트를 어느 처리기가 맡을지도 여기서 등록합니다(처리기 고르기 참고).<\/text><text x=\"32\" y=\"360\" class=\"ln\">그래서 HomeHub 코드를 읽으면 부품이 어떻게 이어져 있는지 한곳에서 볼 수 있습니다.<\/text><\/g>", "desc": "\n<h3>HomeHub: 조립하고 진행시키는 곳<\/h3>\n<p>HomeHub 객체는 직접 계산을 거의 하지 않습니다. 하는 일은 두 가지입니다. ① 처음에 부품을 모두 만들어 연결하고(생성자), ② 바깥에서 부르는 메서드로 일을 진행시킵니다.<\/p>\n<table>\n<tr><th><code>ingest(한 줄)<\/code><\/th><td>메시지 한 줄을 받습니다. 입구에서 이벤트로 바꾸고 접수에 넣습니다. <b>처리는 하지 않습니다.<\/b> 형식이 틀린 줄이면 <code>INVALID<\/code>를 돌려줍니다.<\/td><\/tr>\n<tr><th><code>step()<\/code><\/th><td>대기열에서 하나를 꺼내 처리합니다. 처리 중에 규칙 검사가 새 이벤트를 만들었으면 그것을 대기열에 넣습니다(<code>flushDerived<\/code>).<\/td><\/tr>\n<tr><th><code>drain()<\/code><\/th><td>대기열이 빌 때까지 <code>step()<\/code>을 반복합니다. 처리 중에 새로 생긴 이벤트도 끝까지 처리됩니다.<\/td><\/tr>\n<tr><th><code>tick()<\/code><\/th><td>정기 점검. 진짜 허브에서는 1초마다 불립니다. 점검(Watchdog)이 \"대기열이 막혔다\"고 하면 복구(RecoveryManager)를 부릅니다.<\/td><\/tr>\n<tr><th><code>observable()<\/code><\/th><td>지금 상태를 글자 한 줄로 만듭니다. 아래 \"상태 한 줄 읽기\" 참고.<\/td><\/tr>\n<\/table>\n<h3>상태 한 줄 읽기<\/h3>\n<p>실습 프로그램(<code>HubMain<\/code>)은 입력 파일을 한 줄 처리할 때마다 <code>줄번호 결과 | observable()<\/code>를 출력합니다. 이것을 저장해 둔 것이 동작 기록(<code>golden/*.trace<\/code>)입니다.<\/p>\n<pre>19 drained 3 | q=0[] dev=aircon-1:OFF,…,fridge-1:ERROR,… power=0/4000 metrics={dispatch.count=12,…} audit=[…, OVERHEAT_ALARM:1000000@fridge-1]<\/pre>\n<table>\n<tr><th><code>19 drained 3<\/code><\/th><td>입력 파일 19번째 줄(<code>!drain<\/code>)을 처리했고, 이벤트 3개를 꺼내 처리했다. 메시지 줄이었다면 <code>ACCEPTED<\/code>(받음) 같은 접수 결과가 나옵니다.<\/td><\/tr>\n<tr><th><code>q=0[]<\/code><\/th><td>대기열에 남은 개수와 그 번호들(오래된 것부터)<\/td><\/tr>\n<tr><th><code>dev=…<\/code><\/th><td>기기마다 상태. OFF(꺼짐), IDLE(켜져서 쉼), RUNNING(작동 중), ERROR(고장으로 멈춤). 기기 이름의 알파벳순.<\/td><\/tr>\n<tr><th><code>power=0/4000<\/code><\/th><td>지금 작동 중인 무거운 가전의 전력 합 / 상한(W)<\/td><\/tr>\n<tr><th><code>metrics={…}<\/code><\/th><td>개수 세기의 숫자들<\/td><\/tr>\n<tr><th><code>audit=[…]<\/code><\/th><td>로그의 마지막 3줄<\/td><\/tr>\n<\/table>\n"}, "parser": {"title": "입구 (EventParser)", "crumb": "입구", "parent": "inside", "vb": "0 0 1000 400", "svg": "<g class=\"node static\"><rect x=\"90\" y=\"40\" width=\"70\" height=\"44\" rx=\"4\"/><text x=\"125.0\" y=\"68\" class=\"big m\" text-anchor=\"middle\">10<\/text><\/g><text x=\"125.0\" y=\"104\" class=\"el\" text-anchor=\"middle\">번호<\/text><text x=\"169\" y=\"70\" class=\"big m mu\" text-anchor=\"middle\">|<\/text><g class=\"node static\"><rect x=\"178\" y=\"40\" width=\"128\" height=\"44\" rx=\"4\"/><text x=\"242.0\" y=\"68\" class=\"big m\" text-anchor=\"middle\">fridge-1<\/text><\/g><text x=\"242.0\" y=\"104\" class=\"el\" text-anchor=\"middle\">기기<\/text><text x=\"315\" y=\"70\" class=\"big m mu\" text-anchor=\"middle\">|<\/text><g class=\"node static\"><rect x=\"324\" y=\"40\" width=\"76\" height=\"44\" rx=\"4\"/><text x=\"362.0\" y=\"68\" class=\"big m\" text-anchor=\"middle\">TEMP<\/text><\/g><text x=\"362.0\" y=\"104\" class=\"el\" text-anchor=\"middle\">종류 코드<\/text><text x=\"409\" y=\"70\" class=\"big m mu\" text-anchor=\"middle\">|<\/text><g class=\"node static\"><rect x=\"418\" y=\"40\" width=\"70\" height=\"44\" rx=\"4\"/><text x=\"453.0\" y=\"68\" class=\"big m\" text-anchor=\"middle\">12<\/text><\/g><text x=\"453.0\" y=\"104\" class=\"el\" text-anchor=\"middle\">값<\/text><text x=\"497\" y=\"70\" class=\"big m mu\" text-anchor=\"middle\">|<\/text><g class=\"node static\"><rect x=\"506\" y=\"40\" width=\"102\" height=\"44\" rx=\"4\"/><text x=\"557.0\" y=\"68\" class=\"big m\" text-anchor=\"middle\">240000<\/text><\/g><text x=\"557.0\" y=\"104\" class=\"el\" text-anchor=\"middle\">시각 (ms)<\/text><text x=\"617\" y=\"70\" class=\"big m mu\" text-anchor=\"middle\">|<\/text><g class=\"node static\"><rect x=\"626\" y=\"40\" width=\"102\" height=\"44\" rx=\"4\"/><text x=\"677.0\" y=\"68\" class=\"big m\" text-anchor=\"middle\">unit=C<\/text><\/g><text x=\"677.0\" y=\"104\" class=\"el\" text-anchor=\"middle\">속성<\/text><text x=\"20\" y=\"30\" class=\"gl\">메시지 (글자 한 줄)<\/text><g class=\"edge\" id=\"e-p\"><path d=\"M480,120 V170\"/><text x=\"490\" y=\"150\" class=\"el\">EventParser.parse()<\/text><\/g><g class=\"node static wide\"><rect x=\"250\" y=\"175\" width=\"500\" height=\"200\" rx=\"6\"/><text x=\"262\" y=\"197\" class=\"tt\">이벤트 (Event 객체)<\/text><text x=\"262\" y=\"219\" class=\"ln\"><tspan class='m'>seq       = 10<\/tspan>            번호<\/text><text x=\"262\" y=\"237\" class=\"ln\"><tspan class='m'>deviceId  = \"fridge-1\"<\/tspan>    기기<\/text><text x=\"262\" y=\"255\" class=\"ln\"><tspan class='m'>type      = TEMP_REPORT<\/tspan>   종류 (코드 TEMP)<\/text><text x=\"262\" y=\"273\" class=\"ln\"><tspan class='m'>value     = 12<\/tspan>            값<\/text><text x=\"262\" y=\"291\" class=\"ln\"><tspan class='m'>timestamp = 240000<\/tspan>        시각<\/text><text x=\"262\" y=\"309\" class=\"ln\"><tspan class='m'>attrs     = {unit=C}<\/tspan>      속성<\/text><\/g>", "desc": "\n<h3>입구: 글자 한 줄을 이벤트로 바꾸기<\/h3>\n<p>메시지는 <code>|<\/code>로 나뉜 칸들입니다. 앞의 다섯 칸은 꼭 있어야 하고, 여섯째 칸(속성)은 있을 수도 없을 수도 있습니다. 속성은 <code>이름=값<\/code>을 <code>;<\/code>로 이어 씁니다(예: <code>unit=F;fw=1.4<\/code>).<\/p>\n<table>\n<tr><th>종류 코드<\/th><th>뜻<\/th><th>맡는 처리기<\/th><\/tr>\n<tr><td><code>PWR_ON<\/code> <code>PWR_OFF<\/code><\/td><td>전원 켜짐 / 꺼짐<\/td><td rowspan=\"4\">기기 상태 처리기<\/td><\/tr>\n<tr><td><code>CYC_S<\/code> <code>CYC_E<\/code><\/td><td>작동 시작 / 끝 (세탁 한 번, 건조 한 번 같은 것)<\/td><\/tr>\n<tr><td><code>DOOR_O<\/code> <code>DOOR_C<\/code><\/td><td>문 열림 / 닫힘<\/td><\/tr>\n<tr><td><code>HB<\/code><\/td><td>\"살아 있음\" 신호 (heartbeat). 가전이 주기적으로 보냄<\/td><\/tr>\n<tr><td><code>TEMP<\/code><\/td><td>온도 보고<\/td><td>온도 처리기<\/td><\/tr>\n<tr><td><code>LEAK<\/code><\/td><td>누수 감지 · <b>중요<\/b><\/td><td rowspan=\"2\">안전 처리기<\/td><\/tr>\n<tr><td><code>OVHT<\/code><\/td><td>과열 · <b>중요<\/b>. 가전이 보내기도 하고, HomeHub가 스스로 만들기도 함<\/td><\/tr>\n<\/table>\n<p>알아 둘 것<\/p>\n<ul>\n<li>온도가 화씨(<code>unit=F<\/code>)로 오면 여기서 섭씨로 바꿉니다. 그래서 <code>38<\/code>°F는 이벤트 안에서 <code>3<\/code>(°C)이 됩니다.<\/li>\n<li>칸이 모자라거나 숫자 자리에 글자가 있으면 이벤트를 만들지 않습니다. HomeHub는 이 줄을 버리고 <code>INVALID<\/code>를 돌려줍니다.<\/li>\n<li>모르는 종류 코드는 오류가 아니라 <code>UNKNOWN<\/code> 종류의 이벤트가 됩니다. 개수만 세고 아무 일도 하지 않습니다.<\/li>\n<\/ul>\n"}, "disp": {"title": "접수·꺼내기 (Dispatcher)", "crumb": "접수·꺼내기", "parent": "inside", "vb": "0 0 1000 550", "svg": "<g class=\"node static start\"><rect x=\"380\" y=\"16\" width=\"240\" height=\"40\" rx=\"20\"/><text x=\"500\" y=\"41\" class=\"ln dk\" text-anchor=\"middle\">새 이벤트가 들어옴 <tspan class='m'>submit(e)<\/tspan><\/text><\/g><g class=\"edge\" id=\"e-a\"><path d=\"M500,56 V78\"/><\/g><g class=\"node dia\"><polygon points=\"500,80 610,112 500,144 390,112\"/><text x=\"500\" y=\"108\" class=\"ln dk\" text-anchor=\"middle\">대기열에<\/text><text x=\"500\" y=\"124\" class=\"ln dk\" text-anchor=\"middle\">빈 칸이 있나?<\/text><\/g><g class=\"edge\" id=\"e-y1\"><path d=\"M610,112 H698\"/><text x=\"654\" y=\"104\" class=\"el\" text-anchor=\"middle\">있음<\/text><\/g><g class=\"node static ok\"><rect x=\"700\" y=\"86\" width=\"280\" height=\"56\" rx=\"6\"/><text x=\"712\" y=\"108\" class=\"tt\">넣음<\/text><text x=\"712\" y=\"130\" class=\"ln\"><tspan class='m'>ACCEPTED<\/tspan><\/text><\/g><g class=\"edge\" id=\"e-n1\"><path d=\"M500,144 V178\"/><text x=\"508\" y=\"166\" class=\"el\">가득 참 (8개)<\/text><\/g><g class=\"node dia\"><polygon points=\"500,180 620,212 500,244 380,212\"/><text x=\"500\" y=\"208\" class=\"ln dk\" text-anchor=\"middle\">중요 이벤트인가?<\/text><text x=\"500\" y=\"224\" class=\"ln dk\" text-anchor=\"middle\">(누수 · 과열)<\/text><\/g><g class=\"edge\" id=\"e-y2\"><path d=\"M380,212 H260 V266\"/><text x=\"320\" y=\"204\" class=\"el\" text-anchor=\"middle\">예<\/text><\/g><g class=\"edge\" id=\"e-n2\"><path d=\"M620,212 H740 V266\"/><text x=\"680\" y=\"204\" class=\"el\" text-anchor=\"middle\">아니오<\/text><\/g><g class=\"node dia\"><polygon points=\"260,268 390,300 260,332 130,300\"/><text x=\"260\" y=\"296\" class=\"ln dk\" text-anchor=\"middle\">대기열에<\/text><text x=\"260\" y=\"312\" class=\"ln dk\" text-anchor=\"middle\">비중요 이벤트가 있나?<\/text><\/g><g class=\"node dia\"><polygon points=\"740,268 870,300 740,332 610,300\"/><text x=\"740\" y=\"296\" class=\"ln dk\" text-anchor=\"middle\">autoDrainOnFull<\/text><text x=\"740\" y=\"312\" class=\"ln dk\" text-anchor=\"middle\">설정이 켜져 있나?<\/text><\/g><g class=\"edge\" id=\"e-y3\"><path d=\"M130,300 H135 V388\"/><text x=\"120\" y=\"330\" class=\"el\" text-anchor=\"end\">있음<\/text><\/g><g class=\"edge\" id=\"e-n3\"><path d=\"M390,300 H385 V388\"/><text x=\"400\" y=\"330\" class=\"el\">없음<\/text><\/g><g class=\"edge\" id=\"e-y4\"><path d=\"M610,300 H625 V388\"/><text x=\"600\" y=\"330\" class=\"el\" text-anchor=\"end\">켜짐<\/text><\/g><g class=\"edge\" id=\"e-n4\"><path d=\"M870,300 H865 V388\"/><text x=\"880\" y=\"330\" class=\"el\">꺼짐 (기본)<\/text><\/g><g class=\"node static ok\"><rect x=\"20\" y=\"390\" width=\"230\" height=\"92\" rx=\"6\"/><text x=\"32\" y=\"412\" class=\"ln dk\">가장 오래된 비중요 이벤트를<\/text><text x=\"32\" y=\"430\" class=\"ln dk\">빼고 넣음<\/text><text x=\"32\" y=\"452\" class=\"ln m\">ACCEPTED_EVICTED<\/text><text x=\"238\" y=\"474\" class=\"el\" text-anchor=\"end\">규칙 R2 · R3<\/text><\/g><g class=\"node static ok\"><rect x=\"270\" y=\"390\" width=\"230\" height=\"92\" rx=\"6\"/><text x=\"282\" y=\"412\" class=\"ln dk\">하나를 지금 처리해<\/text><text x=\"282\" y=\"430\" class=\"ln dk\">자리를 만든 뒤 넣음<\/text><text x=\"282\" y=\"452\" class=\"ln m\">ACCEPTED_DRAINED<\/text><text x=\"488\" y=\"474\" class=\"el\" text-anchor=\"end\">규칙 R2<\/text><\/g><g class=\"node static ok\"><rect x=\"510\" y=\"390\" width=\"230\" height=\"92\" rx=\"6\"/><text x=\"522\" y=\"412\" class=\"ln dk\">하나를 지금 처리해<\/text><text x=\"522\" y=\"430\" class=\"ln dk\">자리를 만든 뒤 넣음<\/text><text x=\"522\" y=\"452\" class=\"ln m\">ACCEPTED_DRAINED<\/text><text x=\"728\" y=\"474\" class=\"el\" text-anchor=\"end\">규칙 R4<\/text><\/g><g class=\"node static bad\"><rect x=\"750\" y=\"390\" width=\"230\" height=\"92\" rx=\"6\"/><text x=\"762\" y=\"412\" class=\"ln dk\">받지 않음 (거부)<\/text><text x=\"762\" y=\"430\" class=\"ln dk\">로그에 REJECT<\/text><text x=\"762\" y=\"452\" class=\"ln m\">REJECTED_FULL<\/text><text x=\"968\" y=\"474\" class=\"el\" text-anchor=\"end\">규칙 R4<\/text><\/g><text x=\"20\" y=\"522\" class=\"ln dk\">꺼내 처리 <tspan class='m'>dispatchOne()<\/tspan>:<\/text><g class=\"node static\"><rect x=\"210\" y=\"502\" width=\"180\" height=\"32\" rx=\"4\"/><text x=\"300\" y=\"523\" class=\"ln dk\" text-anchor=\"middle\">대기열에서 맨 앞 하나 꺼냄<\/text><\/g><g class=\"edge\" id=\"e-d0\"><path d=\"M390,518 H408\"/><\/g><g class=\"node static\"><rect x=\"410\" y=\"502\" width=\"180\" height=\"32\" rx=\"4\"/><text x=\"500\" y=\"523\" class=\"ln dk\" text-anchor=\"middle\">처리기 고르기에 넘김<\/text><\/g><g class=\"edge\" id=\"e-d1\"><path d=\"M590,518 H608\"/><\/g><g class=\"node static\"><rect x=\"610\" y=\"502\" width=\"180\" height=\"32\" rx=\"4\"/><text x=\"700\" y=\"523\" class=\"ln dk\" text-anchor=\"middle\">규칙 검사에 '끝났다' 알림<\/text><\/g><g class=\"node codebtn\" id=\"n-code\" data-go=\"disp_code\"><rect x=\"820\" y=\"496\" width=\"160\" height=\"44\" rx=\"6\"/><text x=\"832\" y=\"517\" class=\"tt\">코드로 보기<\/text><text x=\"970\" y=\"515\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g>", "desc": "\n<h3>접수·꺼내기: 받을지 정하고, 꺼내서 넘기기<\/h3>\n<p>접수(Dispatcher)는 두 가지 일을 합니다.<\/p>\n<ul>\n<li><b>받기<\/b>(<code>submit<\/code>): 새 이벤트를 대기열에 넣습니다. 빈 칸이 있으면 그냥 넣고, <b>가득 찼을 때<\/b>만 위 그림의 규칙대로 정합니다.<\/li>\n<li><b>꺼내 처리<\/b>(<code>dispatchOne<\/code>): 대기열 맨 앞 이벤트를 꺼내 처리기 고르기에 넘기고, 처리가 끝나면 규칙 검사에 알립니다.<\/li>\n<\/ul>\n<h3>바꾸면 안 되는 규칙 R1~R4<\/h3>\n<p>대기열이 가득 찼을 때 어떻게 할지는 안전 검토에서 정한 규칙입니다. 실습 B~D에서 AI가 고친 코드가 이 규칙을 지키는지 확인합니다.<\/p>\n<table>\n<tr><th>R1<\/th><td>대기열에는 정해진 개수(8개)보다 많이 넣지 않는다.<\/td><\/tr>\n<tr><th>R2<\/th><td>중요 이벤트(누수, 과열)는 절대 거부하지 않는다. 자리가 없으면 만든다.<\/td><\/tr>\n<tr><th>R3<\/th><td>대기열에 남는 이벤트의 순서는 바꾸지 않는다. 자리를 만들어야 하면 <b>가장 오래된 비중요 이벤트<\/b>를 뺀다.<\/td><\/tr>\n<tr><th>R4<\/th><td>비중요 이벤트는 대기열이 가득 차 있고 <code>autoDrainOnFull<\/code> 설정이 꺼져 있을 때만 거부한다(기본은 꺼짐).<\/td><\/tr>\n<\/table>\n<p>\"하나를 지금 처리해 자리를 만든다\"는, 맨 앞 이벤트를 차례보다 조금 일찍 처리해서 한 칸을 비운다는 뜻입니다. 결과 이름(<code>ACCEPTED<\/code> 등)은 실습 기록의 각 메시지 줄 맨 앞에 나옵니다.<\/p>\n"}, "disp_code": {"title": "접수 코드", "crumb": "코드", "parent": "disp", "html": "<div class=\"code\"><pre>public SubmitResult submit(Event e) {\n    OfferResult r = queue.offer(e);\n    if (r == OfferResult.OK) return ACCEPTED;                 <span class=\"c\">// 빈 칸이 있었음<\/span>\n    <span class=\"c\">// 여기부터는 대기열이 가득 찬 경우<\/span>\n    if (e.isCritical()) {                                     <span class=\"c\">// 중요 이벤트 (R2)<\/span>\n        Event victim = evictOldestNonCritical();              <span class=\"c\">// 가장 오래된 비중요를 뺌 (R3)<\/span>\n        if (victim != null) { audit.record(\"EVICT\", victim); queue.offer(e); return ACCEPTED_EVICTED; }\n        dispatchOne(); queue.offer(e); return ACCEPTED_DRAINED;  <span class=\"c\">// 모두 중요: 하나 처리해 자리 만듦<\/span>\n    }\n    if (autoDrainOnFull) { dispatchOne(); queue.offer(e); return ACCEPTED_DRAINED; }   <span class=\"c\">// R4<\/span>\n    audit.record(\"REJECT\", e); return REJECTED_FULL;           <span class=\"c\">// R4: 기본은 거부<\/span>\n}\n\n<span class=\"c\">// 대기열을 한 바퀴 돌리면서(꺼내서 다시 넣기) 처음 만난 비중요 하나만 다시 넣지 않는다.<\/span>\n<span class=\"c\">// 나머지의 순서는 그대로 (R3)<\/span>\nEvent evictOldestNonCritical() { … }\n\npublic Event dispatchOne() {\n    Event e = queue.poll();\n    if (e == null) return null;\n    handlers.dispatch(e);                <span class=\"c\">// 처리기 고르기 → 처리기<\/span>\n    listener.afterDispatch(e);           <span class=\"c\">// 규칙 검사에 알림<\/span>\n    return e;\n}<\/pre><\/div>", "desc": "\n<h3>접수 코드 (legacy/…/dispatch/Dispatcher.java, 줄였음)<\/h3>\n<p>개수 세기(<code>metrics.increment<\/code>) 줄은 빼고 흐름만 남겼습니다. 위의 결정 그림과 한 줄씩 대응합니다.<\/p>\n"}, "queue": {"title": "대기열 (RingEventQueue)", "crumb": "대기열", "parent": "inside", "vb": "0 0 1000 320", "svg": "<rect class=\"cell\" id=\"rc0\" x=\"150\" y=\"110\" width=\"84\" height=\"54\"/><text class=\"big m\" id=\"rt0\" x=\"192\" y=\"144\" text-anchor=\"middle\"><\/text><text x=\"192.0\" y=\"184\" class=\"el m\" text-anchor=\"middle\">buf[0]<\/text><rect class=\"cell\" id=\"rc1\" x=\"234\" y=\"110\" width=\"84\" height=\"54\"/><text class=\"big m\" id=\"rt1\" x=\"276\" y=\"144\" text-anchor=\"middle\"><\/text><text x=\"276.0\" y=\"184\" class=\"el m\" text-anchor=\"middle\">buf[1]<\/text><rect class=\"cell\" id=\"rc2\" x=\"318\" y=\"110\" width=\"84\" height=\"54\"/><text class=\"big m\" id=\"rt2\" x=\"360\" y=\"144\" text-anchor=\"middle\"><\/text><text x=\"360.0\" y=\"184\" class=\"el m\" text-anchor=\"middle\">buf[2]<\/text><rect class=\"cell\" id=\"rc3\" x=\"402\" y=\"110\" width=\"84\" height=\"54\"/><text class=\"big m\" id=\"rt3\" x=\"444\" y=\"144\" text-anchor=\"middle\"><\/text><text x=\"444.0\" y=\"184\" class=\"el m\" text-anchor=\"middle\">buf[3]<\/text><rect class=\"cell\" id=\"rc4\" x=\"486\" y=\"110\" width=\"84\" height=\"54\"/><text class=\"big m\" id=\"rt4\" x=\"528\" y=\"144\" text-anchor=\"middle\"><\/text><text x=\"528.0\" y=\"184\" class=\"el m\" text-anchor=\"middle\">buf[4]<\/text><rect class=\"cell\" id=\"rc5\" x=\"570\" y=\"110\" width=\"84\" height=\"54\"/><text class=\"big m\" id=\"rt5\" x=\"612\" y=\"144\" text-anchor=\"middle\"><\/text><text x=\"612.0\" y=\"184\" class=\"el m\" text-anchor=\"middle\">buf[5]<\/text><rect class=\"cell\" id=\"rc6\" x=\"654\" y=\"110\" width=\"84\" height=\"54\"/><text class=\"big m\" id=\"rt6\" x=\"696\" y=\"144\" text-anchor=\"middle\"><\/text><text x=\"696.0\" y=\"184\" class=\"el m\" text-anchor=\"middle\">buf[6]<\/text><rect class=\"cell\" id=\"rc7\" x=\"738\" y=\"110\" width=\"84\" height=\"54\"/><text class=\"big m\" id=\"rt7\" x=\"780\" y=\"144\" text-anchor=\"middle\"><\/text><text x=\"780.0\" y=\"184\" class=\"el m\" text-anchor=\"middle\">buf[7]<\/text><text x=\"20\" y=\"143\" class=\"ln dk\">buf (8칸 배열)<\/text><g id=\"qdyn\"><\/g><path class=\"wrapline\" d=\"M822,137 H852 V300 H120 V137 H148\" marker-end=\"url(#ah)\"/><text x=\"500\" y=\"294\" class=\"el\" text-anchor=\"middle\">끝(7) 다음은 다시 처음(0)으로. 이 '돌아가기'를 % 연산으로 계산합니다<\/text><g class=\"node codebtn\" id=\"n-code\" data-go=\"queue_code\"><rect x=\"820\" y=\"10\" width=\"160\" height=\"44\" rx=\"6\"/><text x=\"832\" y=\"31\" class=\"tt\">코드로 보기<\/text><text x=\"970\" y=\"29\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g>", "desc": "\n<div class=\"qctl\"><button data-act=\"offer\">＋ 넣기 (offer)<\/button> <button data-act=\"poll\">− 꺼내기 (poll)<\/button>\n<button data-act=\"qreset\">처음으로<\/button><span id=\"qmsg\"><\/span><\/div>\n<h3>대기열: 8칸짜리 원형 줄<\/h3>\n<p>대기열은 칸이 8개인 배열(<code>buf<\/code>) 하나와 숫자 두 개로 되어 있습니다.<\/p>\n<table>\n<tr><th><code>head<\/code><\/th><td>가장 오래된 이벤트가 있는 칸 번호. 꺼낼 때(<code>poll<\/code>) 여기서 꺼내고 한 칸 앞으로 갑니다.<\/td><\/tr>\n<tr><th><code>count<\/code><\/th><td>지금 기다리는 이벤트 개수. 새 이벤트는 <code>head<\/code>에서 <code>count<\/code>칸 뒤에 넣습니다(<code>offer<\/code>).<\/td><\/tr>\n<\/table>\n<p>이벤트를 꺼낼 때 배열 전체를 앞으로 당기지 않고 <code>head<\/code>만 옮깁니다. 그래서 칸 7 다음에는 다시 칸 0을 씁니다. 칸이 고리처럼 이어진 셈이라 <b>원형 대기열<\/b>이라고 부릅니다.\n위 그림처럼 기다리는 이벤트가 배열 끝(6, 7)과 처음(0, 1)에 걸쳐 있을 수 있습니다. 위 단추로 넣고 꺼내 보면서 <code>head<\/code>가 7에서 0으로 넘어가는 순간을 보세요.<\/p>\n<p>가득 찼을 때(<code>count = 8<\/code>) 넣으면 대기열은 아무것도 바꾸지 않고 <code>FULL<\/code>을 돌려줍니다. 그다음은 <a href=\"#\" data-go=\"disp\">접수<\/a>가 규칙대로 정합니다.<\/p>\n<h3>변경 요청 두 건이 모두 이 클래스를 고칩니다<\/h3>\n<table>\n<tr><th>변경 요청 1 (실습 C)<\/th><td>\"최대 32개까지 받게 해 달라.\" 가득 차면 더 큰 배열로 바꿉니다. 이때 고리 모양으로 걸쳐 있던 이벤트를 새 배열에 <b>순서대로<\/b> 옮기는지가 핵심입니다.<\/td><\/tr>\n<tr><th>변경 요청 2 (실습 A, D)<\/th><td>\"<code>%<\/code> 연산을 없애 달라.\" 위의 '7 다음은 0' 계산을 <code>%<\/code> 없이 해야 합니다.<\/td><\/tr>\n<\/table>\n"}, "queue_code": {"title": "대기열 코드", "crumb": "코드", "parent": "queue", "html": "<div class=\"code\"><pre><span class=\"c\">// 넣기: head에서 count칸 뒤에 넣는다. 끝을 넘으면 % 로 처음부터 센다<\/span>\npublic OfferResult offer(Event e) {\n    if (e == null) return OfferResult.REJECTED;\n    if (count == buf.length) return OfferResult.FULL;     <span class=\"c\">// 가득 참: 아무것도 바꾸지 않음<\/span>\n    buf[<b>(head + count) % buf.length<\/b>] = e;\n    count++;\n    return OfferResult.OK;\n}\n\n<span class=\"c\">// 꺼내기: head 칸에서 꺼내고 head를 한 칸 앞으로. 7 다음은 0<\/span>\npublic Event poll() {\n    if (count == 0) return null;\n    Event e = buf[head];\n    buf[head] = null;\n    head = <b>(head + 1) % buf.length<\/b>;\n    count--;\n    return e;\n}\n\npublic int size()     { return count; }        <span class=\"c\">// 점검이 쓰는 값<\/span>\npublic int capacity() { return buf.length; }   <span class=\"c\">// 점검이 쓰는 값 (지금은 항상 8)<\/span><\/pre><\/div>", "desc": "\n<h3>대기열 코드 (legacy/…/queue/RingEventQueue.java)<\/h3>\n<p>굵게 표시한 두 곳이 '7 다음은 0' 계산입니다. 변경 요청 2는 이 <code>%<\/code>를 없애 달라는 것이고, 변경 요청 1은 <code>buf<\/code>를 더 큰 배열로 바꾸게 됩니다.\n<code>size()<\/code>와 <code>capacity()<\/code>는 <a href=\"#\" data-go=\"watch\">점검<\/a>이 '75% 이상 찼나'를 계산할 때 씁니다.<\/p>\n"}, "reg": {"title": "처리기 고르기 (HandlerRegistry)", "crumb": "처리기 고르기", "parent": "inside", "vb": "0 0 1040 460", "svg": "<text x=\"40\" y=\"14\" class=\"gl\">이벤트 종류<\/text><text x=\"640\" y=\"14\" class=\"gl\">처리기<\/text><g class=\"node static\"><rect x=\"40\" y=\"22\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"42\" class=\"ln m\">PWR_ON<\/text><text x=\"270\" y=\"42\" class=\"el\" text-anchor=\"end\">POWER_ON<\/text><\/g><path class=\"lnk\" d=\"M280,37 C460,37 460,145 638,145\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"60\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"80\" class=\"ln m\">PWR_OFF<\/text><text x=\"270\" y=\"80\" class=\"el\" text-anchor=\"end\">POWER_OFF<\/text><\/g><path class=\"lnk\" d=\"M280,75 C460,75 460,145 638,145\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"98\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"118\" class=\"ln m\">CYC_S<\/text><text x=\"270\" y=\"118\" class=\"el\" text-anchor=\"end\">CYCLE_START<\/text><\/g><path class=\"lnk\" d=\"M280,113 C460,113 460,145 638,145\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"136\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"156\" class=\"ln m\">CYC_E<\/text><text x=\"270\" y=\"156\" class=\"el\" text-anchor=\"end\">CYCLE_END<\/text><\/g><path class=\"lnk\" d=\"M280,151 C460,151 460,145 638,145\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"174\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"194\" class=\"ln m\">DOOR_O<\/text><text x=\"270\" y=\"194\" class=\"el\" text-anchor=\"end\">DOOR_OPEN<\/text><\/g><path class=\"lnk\" d=\"M280,189 C460,189 460,145 638,145\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"212\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"232\" class=\"ln m\">DOOR_C<\/text><text x=\"270\" y=\"232\" class=\"el\" text-anchor=\"end\">DOOR_CLOSE<\/text><\/g><path class=\"lnk\" d=\"M280,227 C460,227 460,145 638,145\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"250\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"270\" class=\"ln m\">HB<\/text><text x=\"270\" y=\"270\" class=\"el\" text-anchor=\"end\">HEARTBEAT<\/text><\/g><path class=\"lnk\" d=\"M280,265 C460,265 460,145 638,145\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"288\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"308\" class=\"ln m\">TEMP<\/text><text x=\"270\" y=\"308\" class=\"el\" text-anchor=\"end\">TEMP_REPORT<\/text><\/g><path class=\"lnk\" d=\"M280,303 C460,303 460,305 638,305\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"326\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"346\" class=\"ln m\">LEAK<\/text><text x=\"270\" y=\"346\" class=\"el\" text-anchor=\"end\">LEAK_DETECTED<\/text><\/g><path class=\"lnk\" d=\"M280,341 C460,341 460,364 638,364\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"364\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"384\" class=\"ln m\">OVHT<\/text><text x=\"270\" y=\"384\" class=\"el\" text-anchor=\"end\">OVERHEAT<\/text><\/g><path class=\"lnk\" d=\"M280,379 C460,379 460,364 638,364\" marker-end=\"url(#ah)\"/><g class=\"node static\"><rect x=\"40\" y=\"402\" width=\"240\" height=\"30\" rx=\"15\"/><text x=\"56\" y=\"422\" class=\"ln m\">그 밖<\/text><text x=\"270\" y=\"422\" class=\"el\" text-anchor=\"end\">UNKNOWN<\/text><\/g><path class=\"lnk\" d=\"M280,417 C460,417 460,425 638,425\" marker-end=\"url(#ah)\"/><g class=\"node \" id=\"n-hDeviceStatusHandler\" data-go=\"handlers\"><rect x=\"640\" y=\"110\" width=\"280\" height=\"70\" rx=\"6\"/><text x=\"652\" y=\"131\" class=\"tt\">기기 상태 처리기<\/text><text x=\"652\" y=\"147\" class=\"sub\">DeviceStatusHandler<\/text><text x=\"910\" y=\"129\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-hTemperatureHandler\" data-go=\"handlers\"><rect x=\"640\" y=\"280\" width=\"280\" height=\"50\" rx=\"6\"/><text x=\"652\" y=\"301\" class=\"tt\">온도 처리기<\/text><text x=\"652\" y=\"317\" class=\"sub\">TemperatureHandler<\/text><text x=\"910\" y=\"299\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-hSafetyHandler\" data-go=\"handlers\"><rect x=\"640\" y=\"336\" width=\"280\" height=\"56\" rx=\"6\"/><text x=\"652\" y=\"357\" class=\"tt\">안전 처리기<\/text><text x=\"652\" y=\"373\" class=\"sub\">SafetyHandler<\/text><text x=\"910\" y=\"355\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><g class=\"node \" id=\"n-hCountingHandler\" data-go=\"handlers\"><rect x=\"640\" y=\"400\" width=\"280\" height=\"50\" rx=\"6\"/><text x=\"652\" y=\"421\" class=\"tt\">개수 처리기<\/text><text x=\"652\" y=\"437\" class=\"sub\">CountingHandler<\/text><text x=\"910\" y=\"419\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g><path class=\"lnk dash\" d=\"M950,40 V420 H922\" marker-end=\"url(#ah)\"/><text x=\"956\" y=\"230\" class=\"el\">모든 종류가<\/text><text x=\"956\" y=\"244\" class=\"el\">마지막에<\/text><text x=\"956\" y=\"258\" class=\"el\">여기도 거침<\/text>", "desc": "\n<h3>처리기 고르기: 종류를 보고 처리기에 넘기기<\/h3>\n<p>꺼낸 이벤트의 <b>종류<\/b>를 보고, 그 종류를 맡은 처리기에 넘깁니다. 그다음 종류와 상관없이 <b>개수 처리기<\/b>에도 넘깁니다.<\/p>\n<p>어느 종류를 어느 처리기가 맡을지는 처리기 고르기 안에 적혀 있지 않습니다. HomeHub가 처음에 조립할 때(생성자) <code>register(종류, 처리기)<\/code>로 하나씩 등록합니다.\n그래서 처리기 고르기의 코드에는 <code>handle(e)<\/code> 한 줄만 있고, 실제로 어느 처리기가 불리는지는 HomeHub 생성자를 봐야 알 수 있습니다.<\/p>\n"}, "handlers": {"title": "처리기 4개", "crumb": "처리기", "parent": "inside", "vb": "0 0 1000 486", "svg": "<g class=\"node static\"><rect x=\"20\" y=\"16\" width=\"230\" height=\"160\" rx=\"6\"/><text x=\"32\" y=\"38\" class=\"tt\">기기 상태 처리기<\/text><text x=\"32\" y=\"54\" class=\"sub\">DeviceStatusHandler<\/text><text x=\"32\" y=\"78\" class=\"ln\">맡는 종류: 전원 · 작동 · 문 · HB<\/text><text x=\"32\" y=\"96\" class=\"ln\">기기 상태를 아래 그림대로 바꿈<\/text><text x=\"32\" y=\"114\" class=\"ln\">무거운 가전은 작동 시작 전에<\/text><text x=\"32\" y=\"132\" class=\"ln\">전력 관리의 허락을 받음<\/text><text x=\"32\" y=\"150\" class=\"ln\">문 열림·닫힘과 그 시각을 적음<\/text><\/g><g class=\"node static\"><rect x=\"265\" y=\"16\" width=\"230\" height=\"160\" rx=\"6\"/><text x=\"277\" y=\"38\" class=\"tt\">온도 처리기<\/text><text x=\"277\" y=\"54\" class=\"sub\">TemperatureHandler<\/text><text x=\"277\" y=\"78\" class=\"ln\">맡는 종류: TEMP<\/text><text x=\"277\" y=\"96\" class=\"ln\">기기의 마지막 온도를 적음<\/text><text x=\"277\" y=\"114\" class=\"ln\">10°C 이상이면<\/text><text x=\"277\" y=\"132\" class=\"ln\">연속 고온 횟수 +1<\/text><text x=\"277\" y=\"150\" class=\"ln\">아니면 0으로 되돌림<\/text><\/g><g class=\"node static\"><rect x=\"510\" y=\"16\" width=\"230\" height=\"160\" rx=\"6\"/><text x=\"522\" y=\"38\" class=\"tt\">안전 처리기<\/text><text x=\"522\" y=\"54\" class=\"sub\">SafetyHandler<\/text><text x=\"522\" y=\"78\" class=\"ln\">맡는 종류: LEAK, OVHT<\/text><text x=\"522\" y=\"96\" class=\"ln\">누수: 작동 중인 세탁기·건조기를<\/text><text x=\"522\" y=\"114\" class=\"ln\">멈춤(ERROR)<\/text><text x=\"522\" y=\"132\" class=\"ln\">과열: 그 기기를 멈춤(ERROR)<\/text><text x=\"522\" y=\"150\" class=\"ln\">멈춘 기기는 전력 관리에서 뺌<\/text><\/g><g class=\"node static\"><rect x=\"755\" y=\"16\" width=\"230\" height=\"160\" rx=\"6\"/><text x=\"767\" y=\"38\" class=\"tt\">개수 처리기<\/text><text x=\"767\" y=\"54\" class=\"sub\">CountingHandler<\/text><text x=\"767\" y=\"78\" class=\"ln\">맡는 종류: 모든 종류<\/text><text x=\"767\" y=\"96\" class=\"ln\">다른 처리기 다음에 항상 불림<\/text><text x=\"767\" y=\"114\" class=\"ln\">evt.종류 개수를 1 셈<\/text><text x=\"767\" y=\"132\" class=\"ln\">(예: evt.temp_report)<\/text><\/g><text x=\"20\" y=\"222\" class=\"gl\">기기 상태가 바뀌는 길 (DeviceStateMachine)<\/text><g class=\"node static state\"><rect x=\"30\" y=\"300\" width=\"160\" height=\"56\" rx=\"28\"/><text x=\"110\" y=\"324\" class=\"tt m\" text-anchor=\"middle\">OFF<\/text><text x=\"110\" y=\"343\" class=\"el\" text-anchor=\"middle\">꺼짐<\/text><\/g><g class=\"node static state\"><rect x=\"290\" y=\"300\" width=\"160\" height=\"56\" rx=\"28\"/><text x=\"370\" y=\"324\" class=\"tt m\" text-anchor=\"middle\">IDLE<\/text><text x=\"370\" y=\"343\" class=\"el\" text-anchor=\"middle\">켜져서 쉼<\/text><\/g><g class=\"node static state\"><rect x=\"550\" y=\"300\" width=\"160\" height=\"56\" rx=\"28\"/><text x=\"630\" y=\"324\" class=\"tt m\" text-anchor=\"middle\">RUNNING<\/text><text x=\"630\" y=\"343\" class=\"el\" text-anchor=\"middle\">작동 중<\/text><\/g><g class=\"node static state\"><rect x=\"810\" y=\"300\" width=\"160\" height=\"56\" rx=\"28\"/><text x=\"890\" y=\"324\" class=\"tt m\" text-anchor=\"middle\">ERROR<\/text><text x=\"890\" y=\"343\" class=\"el\" text-anchor=\"middle\">고장으로 멈춤<\/text><\/g><g class=\"edge\" id=\"e-s1\"><path d=\"M190,320 H288\"/><text x=\"239\" y=\"312\" class=\"el\" text-anchor=\"middle\">PWR_ON<\/text><\/g><g class=\"edge\" id=\"e-s2\"><path d=\"M450,320 H548\"/><text x=\"499\" y=\"312\" class=\"el\" text-anchor=\"middle\">CYC_S<\/text><\/g><g class=\"edge\" id=\"e-s3\"><path d=\"M550,342 H452\"/><text x=\"501\" y=\"360\" class=\"el\" text-anchor=\"middle\">CYC_E<\/text><\/g><g class=\"edge\" id=\"e-s4\"><path d=\"M630,356 C630,400 890,400 890,358\"/><\/g><g class=\"edge\" id=\"e-s5\"><path d=\"M370,356 C370,474 890,474 890,358\"/><text x=\"630\" y=\"470\" class=\"el\" text-anchor=\"middle\">안전 처리기 (누수·과열)<\/text><\/g><g class=\"edge\" id=\"e-s6\"><path d=\"M890,300 C890,250 110,250 110,298\"/><text x=\"500\" y=\"262\" class=\"el\" text-anchor=\"middle\">PWR_OFF (어느 상태에서든 꺼짐으로)<\/text><\/g>", "desc": "\n<h3>처리기 4개<\/h3>\n<p>처리기는 이벤트 종류마다 실제 일을 하는 부품입니다. 처리기들은 서로 부르지 않습니다. 대신 오른쪽 아래의 같은 대상(기기 목록, 전력 관리, 로그, 개수)을 각자 읽고 바꿉니다.<\/p>\n<h3>기기 상태가 바뀌는 길<\/h3>\n<p>기기는 처음에 모두 꺼짐(OFF)입니다. 전원이 켜지면 쉼(IDLE), 작동을 시작하면 작동 중(RUNNING), 작동이 끝나면 다시 쉼으로 돌아옵니다.\n누수나 과열이 생기면 안전 처리기가 고장으로 멈춤(ERROR)으로 바꿉니다. 고장 상태에서는 전원을 끄는 것(<code>PWR_OFF<\/code>)으로만 벗어납니다.<\/p>\n<p><b>무거운 가전<\/b>(1,000W 이상: 세탁기, 건조기, 에어컨, 오븐)이 작동을 시작하려면 <a href=\"#\" data-go=\"power\">전력 관리<\/a>의 허락이 필요합니다. 허락을 못 받으면 상태가 그대로이고 로그에 <code>POWER_DENIED<\/code>가 남습니다.<\/p>\n"}, "rules": {"title": "규칙 검사 (RuleEngine)", "crumb": "규칙 검사", "parent": "inside", "vb": "0 0 1000 430", "svg": "<text x=\"20\" y=\"130\" class=\"el\">이벤트 하나의 처리가<\/text><text x=\"20\" y=\"144\" class=\"el\">끝날 때마다 접수가 부름<\/text><g class=\"edge\" id=\"e-in\"><path d=\"M40,152 V178 H88\"/><\/g><g class=\"node static \"><rect x=\"90\" y=\"150\" width=\"180\" height=\"90\" rx=\"6\"/><text x=\"102\" y=\"172\" class=\"tt\">규칙 검사<\/text><text x=\"102\" y=\"194\" class=\"ln\"><tspan class='m'>afterDispatch(e)<\/tspan><\/text><text x=\"102\" y=\"212\" class=\"ln\">규칙 세 개를 확인<\/text><\/g><g class=\"node static \"><rect x=\"320\" y=\"20\" width=\"660\" height=\"100\" rx=\"6\"/><text x=\"332\" y=\"42\" class=\"tt\">① 냉장고 과열<\/text><text x=\"332\" y=\"64\" class=\"ln\">냉장고가 10°C 이상을 3번 연속 보고하면 과열 이벤트(OVHT)를 새로 만듦<\/text><text x=\"332\" y=\"82\" class=\"ln\">같은 냉장고는 온도가 내려가기 전까지 다시 만들지 않음 · 로그 RULE_OVERHEAT<\/text><\/g><path class=\"lnk\" d=\"M270,195 C295,195 295,70 318,70\" marker-end=\"url(#ah)\"/><g class=\"node static \"><rect x=\"320\" y=\"135\" width=\"660\" height=\"80\" rx=\"6\"/><text x=\"332\" y=\"157\" class=\"tt\">② 문 오래 열림<\/text><text x=\"332\" y=\"179\" class=\"ln\">문이 열린 지 5분이 지났는데 HB가 오면 로그에 DOOR_LEFT_OPEN<\/text><\/g><path class=\"lnk\" d=\"M270,195 C295,195 295,175 318,175\" marker-end=\"url(#ah)\"/><g class=\"node static \"><rect x=\"320\" y=\"230\" width=\"660\" height=\"80\" rx=\"6\"/><text x=\"332\" y=\"252\" class=\"tt\">③ 건조기 추천<\/text><text x=\"332\" y=\"274\" class=\"ln\">세탁기 작동이 끝났고 건조기가 쉬고 있으면 로그에 SUGGEST_DRYER<\/text><\/g><path class=\"lnk\" d=\"M270,195 C295,195 295,270 318,270\" marker-end=\"url(#ah)\"/><g class=\"node static \"><rect x=\"90\" y=\"340\" width=\"300\" height=\"70\" rx=\"6\"/><text x=\"102\" y=\"362\" class=\"tt\">보관함 (outbox)<\/text><text x=\"102\" y=\"384\" class=\"ln\">새로 만든 이벤트가 잠시 머무는 곳<\/text><\/g><g class=\"edge\" id=\"e-ob\"><path d=\"M180,240 V338\"/><text x=\"188\" y=\"292\" class=\"el\">규칙 ①이 만든 새 이벤트<\/text><\/g><g class=\"edge\" id=\"e-fl\"><path d=\"M390,375 H698\"/><text x=\"544\" y=\"366\" class=\"el\" text-anchor=\"middle\">HomeHub가 꺼내 다시 넣음 (flushDerived)<\/text><\/g><g class=\"node \" id=\"n-d\" data-go=\"disp\"><rect x=\"700\" y=\"340\" width=\"280\" height=\"70\" rx=\"6\"/><text x=\"712\" y=\"361\" class=\"tt\">접수<\/text><text x=\"712\" y=\"377\" class=\"sub\">Dispatcher.submit<\/text><text x=\"970\" y=\"359\" class=\"zoom\" text-anchor=\"end\">⊕<\/text><\/g>", "desc": "\n<h3>규칙 검사: 처리가 끝난 뒤 한 번 더 보기<\/h3>\n<p>규칙 검사는 처리기와 따로 있습니다. 접수가 이벤트 하나를 처리기에 넘기고 나면 규칙 검사에 \"방금 이 이벤트를 처리했다\"고 알리고(<code>afterDispatch<\/code>), 규칙 검사는 <a href=\"#\" data-go=\"devices\">기기 목록<\/a>에서 그 기기의 상태를 읽어 규칙 세 개를 확인합니다.<\/p>\n<p>규칙 ②, ③은 로그에 한 줄 적는 것으로 끝납니다. 규칙 ①은 <b>새 이벤트<\/b>를 만듭니다. 새 이벤트는 바로 처리되지 않고 보관함에 들어갔다가, HomeHub가 꺼내서(<code>flushDerived<\/code>) 접수에 넣습니다. 그러면 다른 이벤트처럼 대기열 맨 뒤에서 차례를 기다립니다.\nHomeHub가 만든 이벤트는 가전이 보낸 것과 구별하려고 번호가 1000000부터 붙습니다.<\/p>\n<p>규칙 ①이 보는 '연속 고온 횟수'는 <a href=\"#\" data-go=\"handlers\">온도 처리기<\/a>가 기기 목록에 적어 둔 값입니다.<\/p>\n"}, "devices": {"title": "기기 목록 (DeviceRegistry)", "crumb": "기기 목록", "parent": "inside", "vb": "0 0 1000 440", "svg": "<g class=\"node static \"><rect x=\"20\" y=\"16\" width=\"230\" height=\"104\" rx=\"6\"/><text x=\"32\" y=\"38\" class=\"tt m\">washer-1<\/text><text x=\"32\" y=\"60\" class=\"ln\">세탁기 · WASHER<\/text><text x=\"32\" y=\"78\" class=\"ln\">2,000W<\/text><text x=\"32\" y=\"96\" class=\"ln\">무거운 가전 · 물 사용<\/text><\/g><g class=\"node static \"><rect x=\"265\" y=\"16\" width=\"230\" height=\"104\" rx=\"6\"/><text x=\"277\" y=\"38\" class=\"tt m\">dryer-1<\/text><text x=\"277\" y=\"60\" class=\"ln\">건조기 · DRYER<\/text><text x=\"277\" y=\"78\" class=\"ln\">2,500W<\/text><text x=\"277\" y=\"96\" class=\"ln\">무거운 가전 · 물 사용<\/text><\/g><g class=\"node static \"><rect x=\"510\" y=\"16\" width=\"230\" height=\"104\" rx=\"6\"/><text x=\"522\" y=\"38\" class=\"tt m\">fridge-1<\/text><text x=\"522\" y=\"60\" class=\"ln\">냉장고 · FRIDGE<\/text><text x=\"522\" y=\"78\" class=\"ln\">150W<\/text><text x=\"522\" y=\"96\" class=\"ln\"> <\/text><\/g><g class=\"node static \"><rect x=\"755\" y=\"16\" width=\"230\" height=\"104\" rx=\"6\"/><text x=\"767\" y=\"38\" class=\"tt m\">fridge-2<\/text><text x=\"767\" y=\"60\" class=\"ln\">냉장고 · FRIDGE<\/text><text x=\"767\" y=\"78\" class=\"ln\">150W<\/text><text x=\"767\" y=\"96\" class=\"ln\"> <\/text><\/g><g class=\"node static \"><rect x=\"20\" y=\"132\" width=\"230\" height=\"104\" rx=\"6\"/><text x=\"32\" y=\"154\" class=\"tt m\">aircon-1<\/text><text x=\"32\" y=\"176\" class=\"ln\">에어컨 · AIRCON<\/text><text x=\"32\" y=\"194\" class=\"ln\">1,800W<\/text><text x=\"32\" y=\"212\" class=\"ln\">무거운 가전<\/text><\/g><g class=\"node static \"><rect x=\"265\" y=\"132\" width=\"230\" height=\"104\" rx=\"6\"/><text x=\"277\" y=\"154\" class=\"tt m\">oven-1<\/text><text x=\"277\" y=\"176\" class=\"ln\">오븐 · OVEN<\/text><text x=\"277\" y=\"194\" class=\"ln\">2,200W<\/text><text x=\"277\" y=\"212\" class=\"ln\">무거운 가전<\/text><\/g><g class=\"node static \"><rect x=\"510\" y=\"132\" width=\"230\" height=\"104\" rx=\"6\"/><text x=\"522\" y=\"154\" class=\"tt m\">leak-1<\/text><text x=\"522\" y=\"176\" class=\"ln\">누수센서 · LEAK_SENSOR<\/text><text x=\"522\" y=\"194\" class=\"ln\">1W<\/text><text x=\"522\" y=\"212\" class=\"ln\"> <\/text><\/g><g class=\"node static \"><rect x=\"755\" y=\"132\" width=\"230\" height=\"104\" rx=\"6\"/><text x=\"767\" y=\"154\" class=\"tt m\">tv-1<\/text><text x=\"767\" y=\"176\" class=\"ln\">TV · TV<\/text><text x=\"767\" y=\"194\" class=\"ln\">120W<\/text><text x=\"767\" y=\"212\" class=\"ln\"> <\/text><\/g><text x=\"20\" y=\"266\" class=\"gl\">기기 하나(Device 객체)가 기억하는 것<\/text><g class=\"node static wide\"><rect x=\"20\" y=\"276\" width=\"960\" height=\"150\" rx=\"6\"/><\/g><text x=\"36\" y=\"302\" class=\"ln m dk\">status<\/text><text x=\"226\" y=\"302\" class=\"ln\">상태: OFF / IDLE / RUNNING / ERROR (처음엔 OFF)<\/text><text x=\"516\" y=\"302\" class=\"ln m dk\">lastSeen<\/text><text x=\"706\" y=\"302\" class=\"ln\">마지막으로 메시지를 받은 시각<\/text><text x=\"36\" y=\"332\" class=\"ln m dk\">lastTemp<\/text><text x=\"226\" y=\"332\" class=\"ln\">마지막으로 보고된 온도(°C)<\/text><text x=\"516\" y=\"332\" class=\"ln m dk\">consecutiveHighTemp<\/text><text x=\"706\" y=\"332\" class=\"ln\">연속 고온 횟수 (온도 처리기가 셈)<\/text><text x=\"36\" y=\"362\" class=\"ln m dk\">doorOpen<\/text><text x=\"226\" y=\"362\" class=\"ln\">문이 열려 있나<\/text><text x=\"516\" y=\"362\" class=\"ln m dk\">doorOpenedAt<\/text><text x=\"706\" y=\"362\" class=\"ln\">문을 연 시각<\/text><text x=\"36\" y=\"392\" class=\"ln m dk\">firmware<\/text><text x=\"226\" y=\"392\" class=\"ln\">펌웨어 버전 (처음엔 1.0)<\/text>", "desc": "\n<h3>기기 목록: 기기 8대와 각 기기의 상태<\/h3>\n<p>등록된 기기는 설정 파일의 <code>devices<\/code>에 적힌 8대입니다. 기기 목록(DeviceRegistry)은 이름(<code>fridge-1<\/code> 등)으로 기기 객체를 찾아 줍니다.\n처리기와 규칙 검사가 여기서 기기를 찾아 상태를 읽고 바꿉니다.<\/p>\n<ul>\n<li><b>무거운 가전<\/b>(1,000W 이상)은 작동을 시작할 때 <a href=\"#\" data-go=\"power\">전력 관리<\/a>의 허락을 받아야 합니다.<\/li>\n<li><b>물 사용<\/b> 가전(세탁기, 건조기)은 누수가 감지되면 안전 처리기가 멈춥니다.<\/li>\n<li>모든 기기를 달라고 하면(<code>all()<\/code>) 이름의 알파벳순으로 정렬해서 줍니다(aircon-1, dryer-1, fridge-1, …). 상태 한 줄에 기기가 나오는 순서, 누수 때 안전 처리기가 기기를 멈추는 순서가 이 순서입니다.<\/li>\n<\/ul>\n"}, "power": {"title": "전력 관리 (PowerBudget)", "crumb": "전력 관리", "parent": "inside", "vb": "0 0 1000 300", "svg": "<text x=\"20\" y=\"38\" class=\"gl\">지금 작동 중인 무거운 가전 (running)<\/text><rect class=\"track\" x=\"60\" y=\"50\" width=\"600\" height=\"40\"/><rect class=\"seg \" x=\"60\" y=\"50\" width=\"300\" height=\"40\"/><text x=\"210.0\" y=\"75\" class=\"ln dk\" text-anchor=\"middle\">세탁기 2,000W<\/text><rect class=\"seg \" x=\"360\" y=\"50\" width=\"270\" height=\"40\"/><text x=\"495.0\" y=\"75\" class=\"ln dk\" text-anchor=\"middle\">에어컨 1,800W<\/text><text x=\"20\" y=\"148\" class=\"gl\">오븐(2,200W)이 작동을 시작하려 함<\/text><rect class=\"track\" x=\"60\" y=\"160\" width=\"600\" height=\"40\"/><rect class=\"seg \" x=\"60\" y=\"160\" width=\"300\" height=\"40\"/><text x=\"210.0\" y=\"185\" class=\"ln dk\" text-anchor=\"middle\">세탁기 2,000W<\/text><rect class=\"seg \" x=\"360\" y=\"160\" width=\"270\" height=\"40\"/><text x=\"495.0\" y=\"185\" class=\"ln dk\" text-anchor=\"middle\">에어컨 1,800W<\/text><rect class=\"seg over\" x=\"630\" y=\"160\" width=\"330\" height=\"40\"/><text x=\"795.0\" y=\"185\" class=\"ln dk\" text-anchor=\"middle\">오븐 2,200W<\/text><line class=\"cap\" x1=\"660\" y1=\"30\" x2=\"660\" y2=\"215\"/><text x=\"666.0\" y=\"40\" class=\"el\">상한 4,000W<\/text><text x=\"20\" y=\"240\" class=\"ln dk\">3,800 + 2,200 = 6,000W → 상한을 넘으므로 거부. 오븐은 쉼(IDLE) 상태 그대로, 로그에 POWER_DENIED<\/text><text x=\"20\" y=\"280\" class=\"ln\">가벼운 가전(냉장고 150W, TV 120W, 누수센서 1W)은 허락 없이 작동하고, 이 합계에도 넣지 않습니다.<\/text>", "desc": "\n<h3>전력 관리: 동시에 쓰는 전력을 4,000W 이하로<\/h3>\n<p>집의 차단기가 내려가지 않도록, 동시에 작동하는 무거운 가전의 전력 합을 4,000W 이하로 지킵니다.\n지금 작동 중인 무거운 가전과 그 전력은 <code>running<\/code>이라는 표에 적어 둡니다.<\/p>\n<table>\n<tr><th><code>tryStart(기기, W)<\/code><\/th><td>\"이 기기를 작동시켜도 되나?\" 합이 4,000W를 넘지 않으면 <code>running<\/code>에 적고 허락합니다. 넘으면 거부합니다. 기기 상태 처리기가 무거운 가전의 작동 시작(<code>CYC_S<\/code>) 때 부릅니다.<\/td><\/tr>\n<tr><th><code>stop(기기)<\/code><\/th><td><code>running<\/code>에서 뺍니다. 작동이 끝나거나 안전 처리기가 기기를 멈출 때 부릅니다.<\/td><\/tr>\n<\/table>\n<p>예를 들어 세탁기(2,000W)와 건조기(2,500W)는 합이 4,500W라 동시에 돌 수 없습니다.<\/p>\n"}, "watch": {"title": "점검과 복구 (Watchdog, RecoveryManager)", "crumb": "점검·복구", "parent": "inside", "vb": "0 0 1000 430", "svg": "<text x=\"90\" y=\"24\" class=\"tt\" text-anchor=\"middle\">점검 1<\/text><rect class=\"cell on\" x=\"60\" y=\"160\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"60\" y=\"144\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"60\" y=\"128\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"60\" y=\"112\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"60\" y=\"96\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"60\" y=\"80\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"60\" y=\"64\" width=\"60\" height=\"14\"/><rect class=\"cell\" x=\"60\" y=\"48\" width=\"60\" height=\"14\"/><line class=\"cap\" x1=\"54\" y1=\"79\" x2=\"126\" y2=\"79\"/><text x=\"90\" y=\"196\" class=\"ln dk\" text-anchor=\"middle\">7개<\/text><text x=\"90\" y=\"216\" class=\"el\" text-anchor=\"middle\">6개 이상 ✓<\/text><text x=\"90\" y=\"244\" class=\"tt\" text-anchor=\"middle\">연속 1번<\/text><text x=\"240\" y=\"24\" class=\"tt\" text-anchor=\"middle\">점검 2<\/text><rect class=\"cell on\" x=\"210\" y=\"160\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"210\" y=\"144\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"210\" y=\"128\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"210\" y=\"112\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"210\" y=\"96\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"210\" y=\"80\" width=\"60\" height=\"14\"/><rect class=\"cell\" x=\"210\" y=\"64\" width=\"60\" height=\"14\"/><rect class=\"cell\" x=\"210\" y=\"48\" width=\"60\" height=\"14\"/><line class=\"cap\" x1=\"204\" y1=\"79\" x2=\"276\" y2=\"79\"/><text xt x=\"540\" y=\"244\" class=\"tt\" text-anchor=\"middle\">연속 1번<\/text><text x=\"690\" y=\"24\" class=\"tt\" text-anchor=\"middle\">점검 5<\/text><rect class=\"cell on\" x=\"660\" y=\"160\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"660\" y=\"144\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"660\" y=\"128\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"660\" y=\"112\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"660\" y=\"96\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"660\" y=\"80\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"660\" y=\"64\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"660\" y=\"48\" width=\"60\" height=\"14\"/><line class=\"cap\" x1=\"654\" y1=\"79\" x2=\"726\" y2=\"79\"/><text x=\"690\" y=\"196\" class=\"ln dk\" text-anchor=\"middle\">8개<\/text><text x=\"690\" y=\"216\" class=\"el\" text-anchor=\"middle\">6개 이상 ✓<\/text><text x=\"690\" y=\"244\" class=\"tt\" text-anchor=\"middle\">연속 2번<\/text><text x=\"840\" y=\"24\" class=\"tt\" text-anchor=\"middle\">점검 6<\/text><rect class=\"cell on\" x=\"810\" y=\"160\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"810\" y=\"144\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"810\" y=\"128\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"810\" y=\"112\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"810\" y=\"96\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"810\" y=\"80\" width=\"60\" height=\"14\"/><rect class=\"cell on\" x=\"810\" y=\"64\" width=\"60\" height=\"14\"/><rect class=\"cell\" x=\"810\" y=\"48\" width=\"60\" height=\"14\"/><line class=\"cap\" x1=\"804\" y1=\"79\" x2=\"876\" y2=\"79\"/><text x=\"840\" y=\"196\" class=\"ln dk\" text-anchor=\"middle\">7개<\/text><text x=\"840\" y=\"216\" class=\"el\" text-anchor=\"middle\">6개 이상 ✓<\/text><text x=\"840\" y=\"244\" class=\"tt alarm\" text-anchor=\"middle\">연속 3번<\/text><text x=\"36\" y=\"82\" class=\"el\" text-anchor=\"end\">75%<\/text><text x=\"36\" y=\"96\" class=\"el\" text-anchor=\"end\">(6칸)<\/text><g class=\"node static alarmbox\"><rect x=\"740\" y=\"262\" width=\"240\" height=\"44\" rx=\"6\"/><text x=\"860\" y=\"289\" class=\"ln dk\" text-anchor=\"middle\">3번 연속 → '막혔다' → 복구<\/text><\/g><text x=\"20\" y=\"340\" class=\"gl\">복구 (RecoveryManager): 중요 이벤트만 남기고 나머지는 버림<\/text><rect class=\"cell on\" x=\"20\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"52\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">5<\/text><rect class=\"cell on\" x=\"86\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"118\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">6<\/text><rect class=\"cell crit\" x=\"152\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"184\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">누수<\/text><rect class=\"cell on\" x=\"218\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"250\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">8<\/text><rect class=\"cell crit\" x=\"284\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"316\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">과열<\/text><rect class=\"cell on\" x=\"350\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"382\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">10<\/text><rect class=\"cell on\" x=\"416\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"448\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">11<\/text><g class=\"edge\" id=\"e-rc\"><path d=\"M490,373 H560\"/><\/g><rect class=\"cell crit\" x=\"570\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"602\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">누수<\/text><rect class=\"cell crit\" x=\"636\" y=\"356\" width=\"64\" height=\"34\"/><text x=\"668\" y=\"378\" class=\"ln dk\" text-anchor=\"middle\">과열<\/text><text x=\"20\" y=\"414\" class=\"el\">버린 이벤트마다 로그에 RECOVERY_DROP, 끝나면 RECOVER:kept=2,dropped=5<\/text>", "desc": "\n<h3>점검과 복구: 대기열이 막혔을 때<\/h3>\n<p>처리가 어딘가에서 멈추면 대기열이 줄지 않고 계속 꽉 차 있게 됩니다. <b>점검<\/b>(Watchdog, '감시견')은 이것을 알아채는 부품입니다.<\/p>\n<ol>\n<li>HomeHub는 1초마다 <code>tick()<\/code>을 부르고, 그때마다 점검이 대기열을 한 번 봅니다.<\/li>\n<li>대기열이 <b>75% 이상<\/b>(8칸 중 <b>6개 이상<\/b>) 차 있으면 '꽉 찬 점검' 횟수를 1 늘립니다. 6개 미만이면 0으로 되돌립니다. (위 그림의 점검 3처럼)<\/li>\n<li>이 횟수가 <b>3<\/b>이 되면, 즉 <b>점검 3번 연속으로 대기열이 6개 이상 차 있으면<\/b> \"처리가 멈췄다\"고 판단합니다. 로그에 <code>WATCHDOG<\/code>를 적고 횟수를 0으로 되돌립니다.<\/li>\n<li>HomeHub가 <b>복구<\/b>(RecoveryManager)를 부릅니다. 복구는 대기열에서 중요 이벤트(누수, 과열)만 남기고 나머지를 버립니다.<\/li>\n<\/ol>\n<p>'75%'는 대기열 칸 수(<code>capacity()<\/code>, 지금은 8)에 대한 비율입니다. 계산식은 <code>size() * 4 &gt;= capacity() * 3<\/code>입니다. 3번이라는 기준은 설정 <code>watchdog.threshold<\/code>입니다.<\/p>\n"}, "logs": {"title": "로그 (AuditLog)", "crumb": "로그", "parent": "inside", "vb": "0 0 1000 240", "svg": "<rect class=\"term\" x=\"20\" y=\"16\" width=\"960\" height=\"220\" rx=\"6\"/><text x=\"40\" y=\"46\" class=\"ln m dk\">STATE:fridge-1:OFF-&gt;IDLE<\/text><text x=\"440\" y=\"46\" class=\"tt\">기기 상태 처리기<\/text><text x=\"580\" y=\"46\" class=\"ln\">fridge-1이 꺼짐 → 쉼으로 바뀜<\/text><text x=\"40\" y=\"86\" class=\"ln m dk\">RULE_OVERHEAT:10@fridge-1<\/text><text x=\"440\" y=\"86\" class=\"tt\">규칙 검사<\/text><text x=\"580\" y=\"86\" class=\"ln\">10번 이벤트를 보고 과열 규칙이 걸림<\/text><text x=\"40\" y=\"126\" class=\"ln m dk\">OVERHEAT_ALARM:1000000@fridge-1<\/text><text x=\"440\" y=\"126\" class=\"tt\">안전 처리기<\/text><text x=\"580\" y=\"126\" class=\"ln\">1000000번(과열) 이벤트로 fridge-1을 멈춤<\/text><text x=\"40\" y=\"166\" class=\"ln m dk\">REJECT:42@tv-1<\/text><text x=\"440\" y=\"166\" class=\"tt\">접수<\/text><text x=\"580\" y=\"166\" class=\"ln\">대기열이 가득 차서 42번 메시지를 거부<\/text><text x=\"40\" y=\"206\" class=\"ln m dk\">WATCHDOG:stuck size=7<\/text><text x=\"440\" y=\"206\" class=\"tt\">점검<\/text><text x=\"580\" y=\"206\" class=\"ln\">대기열이 막혔다고 판단 (7개 대기 중)<\/text>", "desc": "\n<h3>로그: 무슨 일이 있었는지 적은 기록<\/h3>\n<p>부품들이 중요한 일을 할 때마다 로그(AuditLog)에 한 줄씩 적습니다. 줄 모양은 두 가지입니다.<\/p>\n<ul>\n<li><code>태그:이벤트번호@기기<\/code> — 어떤 이벤트 때문에 생긴 일. 예: <code>REJECT:42@tv-1<\/code><\/li>\n<li><code>태그:내용<\/code> — 그 밖의 일. 예: <code>STATE:fridge-1:OFF->IDLE<\/code><\/li>\n<\/ul>\n<p>최근 500줄만 남기고 오래된 것부터 지웁니다. 상태 한 줄에는 마지막 3줄이 나옵니다.<\/p>\n<table>\n<tr><th>누가 적나<\/th><th>태그<\/th><\/tr>\n<tr><td>접수<\/td><td><code>EVICT<\/code>(자리를 만들려고 뺌), <code>REJECT<\/code>(거부)<\/td><\/tr>\n<tr><td>기기 상태 처리기<\/td><td><code>STATE<\/code>(상태 바뀜), <code>POWER_DENIED<\/code>(전력 허락 못 받음), <code>UNKNOWN_DEVICE<\/code>(모르는 기기)<\/td><\/tr>\n<tr><td>안전 처리기<\/td><td><code>VALVE_CLOSE<\/code>(누수: 물 잠금), <code>SAFETY_STOP<\/code>(기기 멈춤), <code>OVERHEAT_ALARM<\/code>(과열 경보)<\/td><\/tr>\n<tr><td>규칙 검사<\/td><td><code>RULE_OVERHEAT<\/code>, <code>DOOR_LEFT_OPEN<\/code>, <code>SUGGEST_DRYER<\/code><\/td><\/tr>\n<tr><td>점검 · 복구<\/td><td><code>WATCHDOG<\/code>, <code>RECOVERY_DROP<\/code>(버린 이벤트), <code>RECOVER<\/code>(복구 끝)<\/td><\/tr>\n<\/table>\n"}, "metrics": {"title": "개수 세기 (Metrics)", "crumb": "개수 세기", "parent": "inside", "vb": "0 0 1000 240", "svg": "<rect class=\"term\" x=\"20\" y=\"16\" width=\"960\" height=\"220\" rx=\"6\"/><text x=\"40\" y=\"46\" class=\"ln m dk\">submit.accepted = 12<\/text><text x=\"440\" y=\"46\" class=\"ln\">대기열에 받아들인 이벤트 수<\/text><text x=\"40\" y=\"86\" class=\"ln m dk\">dispatch.count = 12<\/text><text x=\"440\" y=\"86\" class=\"ln\">꺼내서 처리한 이벤트 수<\/text><text x=\"40\" y=\"126\" class=\"ln m dk\">evt.temp_report = 8<\/text><text x=\"440\" y=\"126\" class=\"ln\">온도 보고 이벤트 수 (개수 처리기가 종류마다 셈)<\/text><text x=\"40\" y=\"166\" class=\"ln m dk\">temp.reports = 8<\/text><text x=\"440\" y=\"166\" class=\"ln\">온도 처리기가 처리한 수<\/text><text x=\"40\" y=\"206\" class=\"ln m dk\">safety.overheat = 1<\/text><text x=\"440\" y=\"206\" class=\"ln\">안전 처리기가 처리한 과열 수<\/text>", "desc": "\n<h3>개수 세기: 이름별로 몇 번 일어났나<\/h3>\n<p>개수 세기(Metrics)는 이름표가 붙은 카운터 모음입니다. 부품들이 어떤 일을 할 때 그 이름의 숫자를 1씩 늘립니다(<code>increment(\"submit.accepted\")<\/code>).\n\"지금까지 몇 개를 받았고, 몇 개를 거부했고, 경보가 몇 번 났나\"를 숫자로 보려는 것입니다. 상태 한 줄의 <code>metrics={…}<\/code>에 이름순으로 모두 나옵니다.<\/p>\n<table>\n<tr><th>이름<\/th><th>언제 1 늘어나나<\/th><\/tr>\n<tr><td><code>su   g+='<text class="el" x="'+(x0+8*cw+40)+'" y="137">count = '+Q.count+'</text>';
  svg.getElementById('qdyn').innerHTML=g;
  const m=document.getElementById('qmsg'); if(m) m.innerHTML=msg||'';
  notify();
}
function qoffer(){ if(Q.count===8){qdraw(null,'가득 찼습니다. <code>offer</code>는 아무것도 바꾸지 않고 <code>FULL</code>을 돌려줍니다.');return;}
  const k=(Q.head+Q.count)%8; Q.buf[k]=Q.seq++; Q.count++;
  qdraw(k,'넣기: <code>buf[('+Q.head+' + '+(Q.count-1)+') % 8] = buf['+k+']</code>에 넣고 count를 '+Q.count+'로');}
function qpoll(){ if(Q.count===0){qdraw(null,'비어 있습니다. <code>poll</code>은 <code>null</code>을 돌려줍니다.');return;}
  const h=Q.head, v=Q.buf[h]; Q.buf[h]=null; Q.head=(h+1)%8; Q.count--;
  qdraw(null,'꺼내기: <code>buf['+h+']</code>의 #'+v+'을 꺼내고 <code>head = ('+h+' + 1) % 8 = '+Q.head+'</code>'+(h===7?' ← 7 다음은 0':''));}
const INIT={queue:qreset};
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault();go(g.getAttribute('data-go'),g);return;}
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.getAttribute('data-act');
  if(a==='tour') tourShow(0); else if(a==='next') tourShow(tourAt+1); else if(a==='prev') tourShow(tourAt-1);
  else if(a==='stop') tourStop(); else if(a==='offer') qoffer(); else if(a==='poll') qpoll(); else if(a==='qreset') qreset();
});
document.getElementById('out').addEventListener('click',()=>{if(L[cur].parent) go(L[cur].parent,null);});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&L[cur].parent) go(L[cur].parent,null);
  if(tourAt>=0&&e.key==='ArrowRight'&&tourAt<TOUR.length-1) tourShow(tourAt+1);
  if(tourAt>=0&&e.key==='ArrowLeft'&&tourAt>0) tourShow(tourAt-1);});
const hash=location.hash.slice(1), tm=/^tour(\d+)$/.exec(hash);
const start=(window.HH_START&&L[window.HH_START])?window.HH_START:(tm?'inside':(L[hash]?hash:'outside'));
render(start);
if(tm) tourShow(Math.min(+tm[1],TOUR.length-1));
</script></body></html>
